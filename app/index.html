  POI Tracker — the tablet app
  app/index.html with sw.js, manifest.webmanifest and icon-512.png beside
  it (CLAUDE.md, data-model.md v0.18). Opened from GitHub Pages at
  /poi-tracker/app/ and installable from Chrome, it keeps working with no
  network: the service worker keeps these files on the tablet.

  The look is the approved references, copied, not redrawn:
  - the app CSS of docs/references/main-screen.html v0.42 and the History
    rules of docs/references/history.html v0.28, byte for byte
  - docs/references/_tokens.css v0.23, inlined
  - the Lucide sprite of main-screen.html
  - Manrope 600, 700 and 800, latin, inlined below as WOFF2 (SIL Open
    Font License 1.1, from the @fontsource/manrope package), so no font
    is fetched from the web
  The behaviour follows docs/screens.md v0.59 and docs/data-model.md
  v0.19, and much of it is the code of the working prototype v19.7. The
  look follows v0.59. Still to come: sending.

  v0.1 2026-10-19 — chapter 6 step 2, a build that sends nothing: the
          working screen, the store on the tablet (one key written in one
          step, the event queue with UUIDs and seq, the 3,000 limit, a
          full storage refusing the tap), Undo last, History with every
          state of a row, the type and its target events, the back
          gesture closing one layer, the wake lock, the Web Lock against
          a second tab, a compass stub behind the interface of step 3,
          controls of a later build dimmed (item 77), offline start and
          install. A sample city loads only through ?sample.
  v0.2 2026-10-21 — the gold (screens.md v0.49): the inlined tokens,
          the app CSS and the History rules copied again from
          _tokens.css v0.16, main-screen.html v0.34 and history.html
          v0.21. Gold arrows with a gold ring, a gold N on the compass,
          the class amber renamed gold in the markup and the code, and
          a gold icon.
  v0.3 2026-10-21 — the polish (screens.md v0.50): the canon copied
          again from _tokens.css v0.17, main-screen.html v0.35 and
          history.html v0.22. A tapped side keeps its place: it dips
          while a gold ring leaves it, like a sonar ping, instead of the
          bounce that moved it. A compass with no heading is a dashed
          outline. The type change dialog's "Change" is red.
  v0.4 2026-10-23 — the card (screens.md v0.52): the canon copied
          again from _tokens.css v0.19, main-screen.html v0.37 and
          history.html v0.24. The "Still needed" card becomes three
          progress rings and a rose of the four sides under the heading
          TO GO, with the last pass at its right. The type pill shows no
          passes, its numbers are in ink and its button reads "Change
          type". One lighter gold, #CCA735, for the arrows, the rings
          and the bar of a POI in progress.
  v0.5 2026-10-23 — done by rings (screens.md v0.53, decision D1): the
          counter and every total count the passes that fit the POI's
          type, "to go" is the sum of the rings' "more", and passes that
          do not fit are "to fix" on the head, the row, the grid and the
          summary. A POI is done only when every ring is closed. The disc
          caption of a done-but-to-fix POI names where the passes are.
          The type dialog, the toast's Undo and Cancel removal are v0.6.
  v0.6 2026-10-23 — the approved screens of D1: the canon copied whole
          from _tokens.css v0.20, main-screen.html v0.38 and history.html
          v0.25. A maneuver the type does not allow reads "+26 over"
          when it has passes, every over value carries a half-size plus,
          a row keeps only the triangle while its rings still ask, the
          toast counts what fits, and a not-drivable POI with passes is
          to fix. The type dialog, the toast's Undo and Cancel removal
          move to v0.7.
  v0.7 2026-10-26 — the new look: the canon copied whole from
          _tokens.css v0.22, main-screen.html v0.40 and history.html
          v0.26. Emerald with a warm gold in both themes, a deep gold
          arrow on the ivory discs of the dark theme, the icons of the
          card on --card-glyph, the card at scale 3 (ring columns,
          Straight 1.5 rings higher, larger diamonds, equal space on the
          drawn shapes), the full-size plus and the CSS of the Straight
          only side text, whose markup comes in v0.8. The theme colour
          of the browser's bar follows the new background, and the 18 px
          gap under the working area is closed: the overlays container
          takes no place in the screen's flex column.
  v0.8 2026-10-26 — captions and sides (screens.md v0.55, decisions D2
          and D3 of 2026-10-25): on a Straight only POI each side with
          passes shows its count against 20, "of 20" under it, in the
          done colour at exactly 20, "+3 over" in the warning colour
          past it and "+16" alone ten or more past; nothing locks. One
          caption under the discs, the most urgent that applies: a
          sheet error, then passes to fix or the POI done, then Not
          drivable, then a maneuver over its share, then one done, then
          one the type does not allow, Left before Straight before
          Right. A not drivable POI with passes reads its passes to fix.
  v0.9 2026-10-26 — the type change dialog (screens.md v0.56, items 63
          and 64, decision D1): the sentences on the passes that do not
          fit the new type and where they are, in the sheet, sent from
          this tablet, typed in by hand or waiting on this tablet, and
          under them the switch "Also delete the 2 passes of this
          tablet", on by default, which deletes this tablet's passes
          that do not fit exactly as Delete in History does, a waiting
          pass dropped and a sent one given a removal, in the one write
          of the change. Of a maneuver the new type allows with a
          smaller share it takes the newest passes by seq, as many as do
          not fit, like Undo last. Not drivable counts every pass, the
          larger of the sides' and the maneuvers' totals, so a POI with
          a sheet error asks too, the error named first. Cancel change
          on a refused change without fromType puts back the type the
          sheet's target reads as, never Intersection.
  v0.10 2026-10-26 — Cancel removal and the small defects of the type
          change audit of 2026-10-23 (screens.md items 12, 13, 46, 60
          and 64, findings A1 and A3): a pass whose removal waits
          carries "Cancel removal" in History, which drops the waiting
          removal in one write, with no dialog and no toast, so the
          pass counts again (data-model.md "Event": a waiting event may
          be dropped; the sending step adds that a removal already
          posted waits for its answer first). The type change dialog
          says the passes waiting on this tablet last, after the
          sentence on who put the ones in the sheet there, and names
          the sheet only when some of them are in it. No count on
          screen goes below 0, the sheet error read from the numbers as
          they are. The Not drivable pill carries the class nd of frame
          G. The baseline's target is read once, in baseTarget() and
          typeOf() alike: a number, or a text that is a whole number,
          is that number, anything else is 70. A sheet error comes
          before Not drivable in statusOf() too, so the row, the grid
          tile, the mini-map square and the summary show it as for any
          other POI, and the head keeps "Not drivable" over the
          error's line.
  v0.11 2026-10-26 — gold small arrows (screens.md v0.57, items 12, 36,
          60 and 63): the canon copied whole from main-screen.html v0.41
          and history.html v0.27, the tokens still _tokens.css v0.22.
          The arrows of the type pill's split and of a removal dialog's
          chip take --card-glyph, the gold of the card's icons; the
          toast's arrow takes --man-glyph, the gold of the discs whose
          colours it wears (.toast .ic in the APP ONLY piece); the type
          menu's split and History's rows keep the text colour. No
          behaviour changes.
  v0.12 2026-10-26 — a brighter done green for the grid (screens.md v0.58,
          items 58 and 59): the canon copied whole from _tokens.css v0.23,
          main-screen.html v0.42 and history.html v0.28. The done tiles
          of the All POIs grid, the legend's Done swatch and a done
          square of the mini-map take the new --ok-tile on --ok-tile-bg,
          on light #2F9447 on its own tint, since their large numbers
          need 3:1; the POI column and every small text keep --ok, and
          dark follows --ok. The APP ONLY piece stays. No behaviour
          changes.
  v0.13 2026-10-26 — Undo on the "Type set" toast (screens.md v0.59,
          items 31, 36 and 64): a type change made from the pill or its
          dialog shows "Type set: Straight only" with a gold button
          "Undo", --side-glyph on --side, as tall as any control, for
          --dur-toast-undo; the toast grows to hold it and alone takes
          taps. Undo puts the old type back on the POI whose type
          changed through the path of pickType, so a way back with
          consequences asks first and setType drops or queues the
          target event; passes the dialog's switch deleted stay
          deleted, and its own toast, like the one of "Cancel change"
          in History, carries no button and stays --dur-toast. The
          Undo toast closes at once when the active POI or route
          changes or another toast replaces it. Both durations are read
          from the tokens, no longer literals in the script.
  v0.14 2026-10-26 — speed step 1, the POI column redraws only what
          changed (the performance audit of 2026-10-25: about half of a
          tap was the column rebuilt whole and its scroll set).
          renderColumn() still computes every row's markup and every
          dot's class, compares them with what it drew last time and
          replaces only the rows, dots and caption that differ, the
          list's scroll untouched and no layout forced; it rebuilds the
          whole column only on the first draw, for another route or
          city, a different number of POIs or the rail's finger and
          bubble. The store and its write stay as they are (item 78).
  v0.15 2026-10-27 — a temporary test switch for the band seen on the
          tablet on 2026-10-27, a band across the middle of the screen
          gone black or full of noise while a locked disc showed beside
          an active Left. Opened as app/?lab=0 to app/?lab=4, it puts the
          class lab-N on the root element for that page load and "Test N"
          in --warn after the city name. Each variant changes one thing
          about a locked disc: lab-0 draws it as before, lab-1 without
          its shadow, lab-2 opaque in its colours mixed with --bg, lab-3
          with every disc on its own layer (will-change: opacity), lab-4
          without the disc's opacity fade. Any other value changes
          nothing, and the switch touches no storage. To be removed once

  .rail span { position: absolute; left: 0; right: 0; text-align: center;
               transform: translateY(-50%); font-size: var(--t-small);
               font-weight: var(--w-heavy); color: var(--ink-2); line-height: var(--lh-tight); }
  .finger { position: absolute; left: 0; right: 0; height: var(--tap-min);
            border-radius: var(--r-md); background: var(--man-soft);
            box-shadow: inset 0 0 0 1px var(--line); transform: translateY(-50%); }
  .bubble { position: absolute; right: calc(var(--s-6) + var(--s-2)); min-width: var(--tap-min);
            height: var(--tap-min); padding: 0 var(--s-4); border-radius: var(--r-md);
            background: var(--disc); color: var(--disc-glyph); font-size: var(--t-title);
            font-weight: var(--w-heavy); display: flex; align-items: center;
            justify-content: center; box-shadow: var(--shadow-lift);
            transform: translateY(-50%); z-index: 12; }
  /* "Add routes in Settings" (item 35): the action bar's button look, its
     radius concentric with the column's */
  .colbtn { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2);
            margin: var(--s-3); width: calc(100% - 2 * var(--s-3)); min-height: var(--tap-min);
            padding: var(--s-3) var(--s-4); font-size: var(--t-body); font-weight: var(--w-bold);
            line-height: round(up, calc(var(--lh-body) * var(--t-body)), 1px);
            text-wrap: balance; color: var(--ink);
            background: var(--panel-strong); border: 1px solid var(--line);
            border-radius: calc(var(--r-md) - var(--s-3) - 1px); }
  .colbtn .ic { margin-right: -0.375em; }

  /* ---- head (items 4, 19, 43). The number's box is trimmed to its cap
     height and baseline and rounded up to a whole pixel; the counter column
     keeps --s-3 between its trimmed lines, so its cap top and last baseline
     are level with the number's. In portrait the head keeps room for the
     compass, which sits at the main area's top, one gap under the top bar:
     the head is at least as tall as the compass, so the type pill sits one
     gap under it (item 19). ---- */
  .head { display: flex; flex-wrap: nowrap; align-items: flex-start; gap: var(--s-4);
          min-height: var(--compass);
          padding-right: calc(var(--compass) + var(--s-2)); }
  /* ink shifted left by the digits' side bearing: Manrope ExtraBold sets a
     "1" 3px and a "5" 5px in at 92px, so the midpoint keeps both within 1px */
  .big { flex: none; font-size: var(--t-num); line-height: var(--lh-tight);
         font-weight: var(--w-heavy); text-box: trim-both cap alphabetic;
         height: round(up, 1cap, 1px); margin-left: -0.0435em; }
  .big.dash { color: var(--ink-3); }
  .hcol { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--s-3); }
  .plabel { font-size: var(--t-small); letter-spacing: calc(var(--s-1) / 2);
            font-weight: var(--w-bold); color: var(--ink-2); line-height: var(--lh-tight);
            text-box: trim-both cap alphabetic; }
  .cnt { font-size: var(--t-title); font-weight: var(--w-heavy); line-height: var(--lh-tight);
         text-wrap: balance; text-box: trim-both cap alphabetic; }
  .rest { font-size: var(--t-body); font-weight: var(--w-medium); color: var(--ink-2);
          line-height: var(--lh-tight); text-box: trim-both cap alphabetic; }
  .rest span { white-space: nowrap; }
  .rest.ok { color: var(--ok); font-weight: var(--w-bold); }
  /* item 4: the passes that do not fit the type, "53 to fix", in the warning colour */
  .rest .fix { color: var(--warn); font-weight: var(--w-bold); }
  /* the compass (item 19): a drawn widget on a raised round face, all in
     tokens. One arrow shows where the car drives: its left half --disc,
     the colour of the maneuver discs, its right half --side, the colour of
     the side discs. The dial stays fixed with N up. The letter N is gold
     (--compass-n) with a dark gold outline on light (--compass-n-edge),
     its 0.7 width SVG geometry in the dial's 96-unit box. */
  .compass { position: absolute; right: anchor(--main right); top: anchor(--main top);
             width: var(--compass); height: var(--compass); border-radius: 50%;
             background: var(--panel-raised); box-shadow: var(--shadow); z-index: 2; }
  .compass .edge { fill: none; stroke: var(--line); }
  .compass .minor { fill: none; stroke: var(--ink-3); stroke-linecap: round; }
  .compass .major { fill: none; stroke: var(--ink-2); stroke-linecap: round; }
  .compass text { font-size: var(--t-small); fill: var(--ink-2); font-weight: var(--w-bold);
                  text-anchor: middle; dominant-baseline: central; }
  .compass .cn { fill: var(--compass-n); font-weight: var(--w-heavy); stroke: var(--compass-n-edge);
                 stroke-width: 0.7px; paint-order: stroke; stroke-linejoin: round; }
  .compass .halo { fill: none; stroke: var(--panel-raised); stroke-linejoin: round; }
  .compass .dark { fill: var(--disc); }
  .compass .gold { fill: var(--side); }
  /* no heading yet, or only a last known course (the pale arrow of
     data-model.md "Heading"): the arrow is a dashed outline without
     fill, so a stale course never passes for a live one. It is always
     on the dial: with no heading yet it shows the course this tablet
     saved last, or north (item 19). Stroke and dashes are SVG geometry
     in the dial's 96-unit box. */
  .compass.idle .halo { display: none; }
  .compass.idle .dark, .compass.idle .gold { fill: none; stroke: var(--ink-2); stroke-width: 1.4px;
                                             stroke-dasharray: 3 2.2; stroke-linejoin: round; }

  /* ---- type pill and its menu (items 46, 60, 69) ---- */
  .typewrap { anchor-name: --pill; }
  .typebtn { width: 100%; display: flex; align-items: center; gap: var(--s-3);
             min-height: var(--tap-min); padding: var(--s-2) var(--s-4);
             background: var(--panel-strong); border: 1px solid var(--panel-edge);
             border-radius: var(--r-md); box-shadow: var(--shadow); }
  /* the tile is a map of the maneuvers: three fixed slots, Left, Straight,
     Right; an absent maneuver leaves its slot empty. One size for every
     type (the pill's inner height less its two hairlines), radius concentric
     with the pill's. */
  .ticon { flex: none; display: grid; grid-template-columns: repeat(3, var(--s-5));
           gap: var(--s-1); justify-content: center; align-content: center;
           width: calc(3 * var(--s-5) + 2 * var(--s-1) + 2 * var(--s-2));
           height: calc(var(--tap-min) - 2 * (var(--s-2) + 1px));
           border-radius: calc(var(--r-md) - var(--s-2) - 1px); background: var(--disc);
           color: var(--man-glyph); }
  .ticon svg { width: var(--s-5); height: var(--s-5); }
  .ticon .sl { grid-column: 1; }
  .ticon .ss, .ticon .sb { grid-column: 2; }
  .ticon .sr { grid-column: 3; }
  .typebtn.nd { background: transparent; border: 1px dashed var(--ink-2); box-shadow: none; }
  .typebtn.nd .ticon, .ticon.nd { background: transparent;
                                  box-shadow: inset 0 0 0 1px var(--ink-2); color: var(--ink-2); }
  .typebtn.off { opacity: var(--o-off); }
  /* the name and the split share one centre line, in the middle of the
     space between the tile and "Change type" (item 60, v0.36) */
  .tl { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center;
        gap: var(--s-1); }
  .tl b { font-size: var(--t-label); font-weight: var(--w-heavy); line-height: var(--lh-tight);
          white-space: nowrap; }
  .tl small, .ol small { display: flex; flex-wrap: wrap; align-items: center; column-gap: var(--s-1);
                         row-gap: var(--s-1); font-size: var(--t-small); font-weight: var(--w-bold);
                         color: var(--ink-2); line-height: var(--lh-tight); }
  /* the pill's split reads at a glance: its numbers --t-label heavy in --ink
     like the screen's other numbers (v0.36: in gold beside the gold arrows
     they tired the eye), still smaller than the card's counts, on the line's
     baseline (item 60). The pill and the menu show no passes (v0.36). The
     menu keeps its grey split. The split's arrows are gold, --card-glyph, as
     the icons on the card (v0.41). */
  .tl small { align-items: baseline; }
  .tl small .tn { font-size: var(--t-label); font-weight: var(--w-heavy); color: var(--ink);
                  line-height: var(--lh-tight); }
  .tl small .ic { color: var(--card-glyph); }
  .tchg { display: inline-flex; align-items: center; gap: var(--s-1); font-size: var(--t-small);
          font-weight: var(--w-heavy); color: var(--ink-2); white-space: nowrap; }
  .tchg .ic { margin-right: -0.25em; }

  /* ---- "Still needed" card (item 39, v0.36): under its heading "TO GO",
     the maneuvers as progress rings in a pyramid, Straight on top, Left
     below left and Right below right, as the discs stand under the card,
     and beside them the sides as a rose of four diamonds, N above, E
     right, S below and W left. The pyramid and the rose share one centre
     line and equal space around them, measured on the drawn rings and the
     tips of the diamonds (v0.39). The card is a container: its own width
     sets the size of the rings, their columns and the rose. Its padding
     is one knob, --pad: the compact, the compact landscape and the roomy
     card set it, and .two reads it. ---- */
  .card { --pad: var(--s-4); background: var(--panel); border: 1px solid var(--panel-edge);
          border-radius: var(--r-md); box-shadow: var(--shadow); padding: var(--pad);
          display: flex; flex-direction: column; gap: var(--s-3);
          container-type: inline-size; container-name: card; }
  .spt { font-size: var(--t-small); letter-spacing: calc(var(--s-1) / 2);
         font-weight: var(--w-heavy); color: var(--ink-2); line-height: var(--lh-tight); }
  /* the head: TO GO on the left, the last pass of this POI on the right,
     the pass Undo last would remove (item 9). With no such pass it is empty. */
  .khead { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); }
  .lp { display: inline-flex; align-items: baseline; gap: var(--s-1); font-size: var(--t-small);
        font-weight: var(--w-heavy); color: var(--ink-2); line-height: var(--lh-tight);
        white-space: nowrap; }
  .lp .spt { margin-right: var(--s-1); }
  /* the icon is 1em of the text, so a head with LAST is as tall as one without;
     it takes the gold of the card's icons (--card-glyph, v0.40) */
  .lp .ic { align-self: center; color: var(--card-glyph); }
  /* equal space on the drawn shapes (v0.39): .two spans the card's whole
     width, padding and hairline included, and the pyramid and the rose
     give up their overhang in negative margins. The Left and Right
     circles sit (col - ring) / 2 plus 2 of the drawing's 76 units inside
     the pyramid's box, and a diamond's rounded tip sits (√2 - 1) of its
     radius inside the rose's box. So space-evenly puts the same space
     before the Left circle, between the Right circle and the West tip,
     and after the East tip. */
  .two { --ring: var(--card-ring); --col: var(--card-col); --rose: var(--card-rose);
         --num: var(--t-title); display: flex; align-items: center;
         justify-content: space-evenly; margin-inline: calc(-1 * var(--pad) - 1px); }
  /* the pyramid: three columns of --col, Left and Right --card-rise rings
     lower than Straight. On a tight card it may give up width, and its
     columns then overflow evenly into the card's padding. */
  .pyr { flex: 0 1 auto; min-width: 0; display: grid; grid-template-columns: repeat(3, auto);
         justify-content: center; column-gap: var(--s-1);
         margin-inline: calc(-1 * ((var(--col) - var(--ring)) / 2 + var(--ring) / 38)); }
  .mz { display: flex; flex-direction: column; align-items: center; gap: var(--s-1);
        width: var(--col); }
  .mz.low { margin-top: calc(var(--card-rise) * var(--ring)); }
  .wheel { position: relative; width: var(--ring); height: var(--ring); }
  /* the ring starts at the top and runs clockwise. Its circles are SVG
     geometry: a track and, once a pass counts, the part driven, both 6 of
     the drawing's 76 units wide. The part driven takes the one gold
     (--card-fill, --gold-line): the icons on the card take it as
     --card-glyph, the arrows on the discs and the type tile take
     --man-glyph (item 5, v0.40). */
  .pg { position: absolute; inset: 0; width: 100%; height: 100%; rotate: -90deg; fill: none; }
  .pg .bg { stroke: var(--line); }
  .pg .fg { stroke: var(--card-fill); stroke-linecap: round; }
  .mz.ok .fg { stroke: var(--ok); }
  .mz.off { opacity: var(--o-zero); }
  .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: calc(var(--s-1) / 2); line-height: var(--lh-tight);
        white-space: nowrap; }
  .rv { font-size: var(--num); font-weight: var(--w-heavy); }
  /* item 39: over its share the ring is full and reads "+3 over": the number a
     step smaller in the warning colour, the plus as big as the digits and on
     their middle line (v0.39), one inline group that .in centres in the ring.
     The tight letter-spacing also follows the last digit, so the box ends
     0.03em short on the right: a margin of that size restores the balance,
     and the ink, not the box, sits centred. */
  .mz.over .rv { color: var(--warn); font-size: calc(0.9 * var(--num)); letter-spacing: -0.03em;
                 margin-right: 0.03em; }
  .rv .pl { font-size: 1em; vertical-align: 0; margin-right: 0.02em; }
  .in small { font-size: var(--t-tiny); font-weight: var(--w-bold); color: var(--ink-2); }
  /* "Done" is a label, not a number: smaller, in the done colour */
  .in .dn { font-size: var(--t-small); font-weight: var(--w-heavy); color: var(--ok); }
  .mn { display: inline-flex; align-items: center; gap: var(--s-1); font-size: var(--t-small);
        font-weight: var(--w-heavy); color: var(--ink-2); line-height: var(--lh-tight);
        white-space: nowrap; }
  /* the icons on the card take --card-glyph, the arrows on the discs and the
     type tile --man-glyph (item 5, v0.40) */
  .mn .ic { width: var(--card-icon); height: var(--card-icon); color: var(--card-glyph); }
  /* the rose: a 2 x 2 grid turned 45 degrees. A square turned 45 degrees
     fits its box inset by (1 - 1/√2) / 2 of the box on every edge */
  .rose { flex: none; position: relative; width: var(--rose); height: var(--rose);
          margin-inline: calc(-0.4142 * var(--r-sm)); }
  .grid4 { position: absolute; inset: calc(0.146 * var(--rose)); display: grid;
           grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: var(--s-2);
           rotate: 45deg; }
  .dm { display: grid; place-items: center; border-radius: var(--r-sm);
        background: var(--side-soft); }
  .dmi { rotate: -45deg; display: flex; flex-direction: column; align-items: center;
         gap: var(--s-1); line-height: var(--lh-tight); }
  .dl { font-size: var(--t-small); font-weight: var(--w-heavy); color: var(--warn); }
  .dv { font-size: var(--num); font-weight: var(--w-heavy); }
  .dm.z .dmi { opacity: var(--o-zero); }
  /* decision D2 (items 39, 46, v0.39): on a Straight only POI a side with
     passes shows its count against 20, "of 20" under it. At exactly 20 the
     count and its line take the done colour; past 20 the line reads "+3
     over" and both take the warning colour. Nothing locks, and a side at
     zero shows no line. Ten or more past 20 the line reads "+16" alone, and
     the markup leaves out " over" (v0.40). */
  .of { font-size: var(--t-tiny); font-weight: var(--w-bold); color: var(--ink-2);
        line-height: var(--lh-tight); white-space: nowrap; }
  .dm.ok .dv, .dm.ok .of { color: var(--ok); }
  .dm.ov .dv, .dm.ov .of { color: var(--warn); }
  /* narrower cards: the portrait minimum and the left group beside the discs */
  @container card (width < 480px) {
    .two { --ring: var(--card-ring-narrow); --col: var(--card-col-narrow);
           --rose: var(--card-rose-narrow); --num: var(--t-label); }
    /* "+3 over" would cross the diamond's edge: past 20 the line keeps "+3" alone */
    .dm.ov .of span { display: none; }
  }
  @container card (width <= 380px) {
    .two { --ring: var(--card-ring-small); --col: var(--card-col-small);
           --rose: var(--card-rose-small); }
    .pyr { column-gap: var(--s-2); }
    .in small, .of { display: none; }
  }

  /* ---- discs (items 5, 6, 10, 19, 26, 46). The closed cluster sits in the
     middle of its free space. Where the zone is too short for centred discs
     plus one caption line, the cluster rises just enough for the caption to
     keep --s-4 from the action bar. The open compass is centred too and, where
     it does not fit, keeps --s-2 from the bar and rises over the card. The
     placement depends on the zone's height only, never on a caption, and is
     rounded to a whole pixel. A disc is --disc with a gold arrow
     (--man-glyph) and, while it can be tapped, a gold ring of --s-1
     (--man-ring). A locked disc fades and keeps only --shadow, no ring
     (item 5). Discs and sides are centred with the translate property,
     never a transform, so a scale (a press, a bloom, a tap) keeps their
     centre. ---- */
  .stagezone { flex: 1; min-height: 0; position: relative; }
  .stagebox { position: absolute; left: 0; right: 0; height: calc(2 * var(--disc-man));
              top: round(max(0px, min(calc((100% - 2 * var(--disc-man)) / 2),
                                      calc(100% + var(--gap) - var(--s-4) - 2 * var(--disc-man)
                                           - (var(--s-4) + round(up, calc(var(--lh-body) * var(--t-body)), 1px) + 2 * var(--s-1))))), 1px); }
  .stagebox:has(.stage.open) { height: calc(2 * var(--side-reach) + var(--disc-side));
              top: round(min(calc((100% - (2 * var(--side-reach) + var(--disc-side))) / 2),
                             calc(100% + var(--gap) - var(--s-2) - var(--s-1)
                                  - (2 * var(--side-reach) + var(--disc-side)))), 1px); }
  .stage { position: relative; margin: 0 auto; height: 100%;
           width: calc(2 * var(--side-reach) + 2 * var(--s-2) + var(--disc-man)); }
  .disc { position: absolute; left: 50%; top: 50%; width: var(--disc-man); height: var(--disc-man);
          border-radius: 50%; translate: -50% -50%; display: flex;
          align-items: center; justify-content: center; background: var(--disc);
          color: var(--man-glyph); box-shadow: 0 0 0 var(--s-1) var(--man-ring), var(--shadow-lift);
          z-index: 3; }
  .disc svg { width: 56%; height: 56%; }
  .disc.l { left: calc(50% - var(--side-reach) - var(--s-2));
            top: calc(50% + (var(--side-reach) - var(--s-2)) / 2); }
  .disc.st { top: calc(50% - (var(--side-reach) - var(--s-2)) / 2); }
  .disc.r { left: calc(50% + var(--side-reach) + var(--s-2));
            top: calc(50% + (var(--side-reach) - var(--s-2)) / 2); }
  .stage.open .disc.on { left: 50%; top: 50%; }
  .stage.open .disc:not(.on) { visibility: hidden; }
  .disc.locked { opacity: var(--o-locked); box-shadow: var(--shadow); }
  .side { position: absolute; left: 50%; top: 50%; width: var(--disc-side); height: var(--disc-side);
          border-radius: 50%; translate: -50% -50%; display: flex;
          align-items: center; justify-content: center; font-size: var(--t-title);
          font-weight: var(--w-heavy); line-height: var(--lh-tight); background: var(--side);
          color: var(--side-glyph); box-shadow: 0 0 0 var(--s-1) var(--side-ring), var(--shadow-lift);
          z-index: 4; }
  .side-n { top: calc(50% - var(--side-reach)); }
  .side-s { top: calc(50% + var(--side-reach)); }
  .side-w { left: calc(50% - var(--side-reach)); }
  .side-e { left: calc(50% + var(--side-reach)); }
  /* the caption sits --s-4 under the lowest disc, centred, on one line, as
     wide as its text up to the zone's width plus --s-2 on each side, so a
     wider font rendering never wraps it */
  .lock { position: absolute; left: 50%; top: calc(100% + var(--s-4)); translate: -50% 0;
          width: max-content; max-width: calc(100% + 2 * var(--s-2)); text-wrap: balance;
          font-size: var(--t-body); font-weight: var(--w-bold); border-radius: var(--r-sm);
          padding: var(--s-1) var(--s-3); text-align: center;
          line-height: round(up, calc(var(--lh-body) * var(--t-body)), 1px); }
  .lock.ok { color: var(--ok); background: var(--ok-bg); }
  .lock.err { color: var(--err); background: var(--err-bg); }
  .lock.info { color: var(--ink-2); background: var(--panel-strong); }
  /* item 46: every ring closed and passes still to fix, on the gold tint */
  .lock.fix { color: var(--warn); background: var(--active); }

  /* ---- action bar (items 3, 8, 9, 10, 26, 27, 42, 51): buttons concentric
     with the bar; in landscape the bar runs under the whole main area and
     holds the summary; a dimmed control carries its caption ---- */
  .bar { flex: none; display: flex; align-items: center; gap: var(--s-2); padding: var(--s-2);
         background: var(--panel); border: 1px solid var(--panel-edge);
         border-radius: var(--r-md); box-shadow: var(--shadow); }
  .btn { display: inline-flex; align-items: center; height: var(--tap-min);
         padding: 0 var(--s-4); font-size: var(--t-body); font-weight: var(--w-bold);
         background: var(--panel-strong); border: 1px solid var(--line);
         border-radius: calc(var(--r-md) - var(--s-2) - 1px); white-space: nowrap; }
  .btn.off { opacity: var(--o-off); }
  .btn.cancel { margin-left: auto; }
  .barnote { font-size: var(--t-small); font-weight: var(--w-medium); color: var(--ink-2);
             line-height: var(--lh-tight); white-space: nowrap; }

  /* ---- overlays: dimmed background, dialogs (item 63), the grid (59, 66).
     Raised surfaces in both themes; dialogs snap to whole pixels. ---- */
  .scrim { position: absolute; inset: 0; z-index: 25; background: var(--scrim); }
  .scrim.top { z-index: 50; }
  .dlg { position: absolute; z-index: 51; left: round(50%, 1px); top: round(50%, 1px);
         translate: round(-50%, 1px) round(-50%, 1px);
         width: calc(100% - 2 * var(--s-6)); max-width: calc(var(--col-narrow) + var(--col-wide));
         background: var(--panel-raised); border: 1px solid var(--panel-edge);
         border-radius: var(--r-lg); box-shadow: var(--shadow-lift); padding: var(--s-5);
         display: flex; flex-direction: column; gap: var(--s-4); }
  .dtitle { font-size: var(--t-title); font-weight: var(--w-heavy); line-height: var(--lh-tight); }
  .dchip { align-self: flex-start; display: inline-flex; align-items: center; gap: var(--s-1);
           padding: var(--s-2) var(--s-3); border-radius: var(--r-sm); background: var(--man-soft);
           font-size: var(--t-label); font-weight: var(--w-heavy); line-height: var(--lh-tight); }
  .dchip .ic { color: var(--card-glyph); }
  .dbody { font-size: var(--t-body); font-weight: var(--w-medium);
           line-height: round(up, calc(var(--lh-body) * var(--t-body)), 1px);
           text-wrap: balance; color: var(--ink-2); }
  .dbtns { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); margin-top: var(--s-2); }
  /* item 63: button words at the size of the action bar's buttons */
  .dbtn { height: calc(var(--tap-min) + var(--s-2)); border-radius: var(--r-sm);
          font-size: var(--t-body); font-weight: var(--w-bold); background: var(--man-soft);
          border: 1px solid var(--line); display: inline-flex; align-items: center;
          justify-content: center; }
  .dbtn.danger { background: var(--danger); border-color: var(--danger); color: var(--on-danger); }
  .dbtn.primary { background: var(--disc); border-color: var(--disc); color: var(--disc-glyph); }
  /* item 63: the switch row of a type change dialog, in the style of the Sound
     row of Settings: the label with its line beside the switch */
  .drow { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3);
          border-radius: var(--r-sm); background: var(--man-soft); }
  .drow .ol b { font-size: var(--t-body); font-weight: var(--w-bold); }
  .drow .ol small { display: block; font-size: var(--t-small); font-weight: var(--w-medium);
                    color: var(--ink-2); line-height: round(up, calc(var(--lh-body) * var(--t-small)), 1px); }
  /* a switch (items 63, 65), on in the colour of the discs: the Sound row of
     Settings and the type change dialog share it */
  .switch { flex: none; position: relative; width: calc(var(--s-6) + var(--s-5)); height: var(--s-6);
            border-radius: var(--s-4); background: var(--disc); }
  .switch::after { content: ""; position: absolute; top: var(--s-1); right: var(--s-1);
                   width: var(--s-5); height: var(--s-5); border-radius: 50%; background: var(--disc-glyph); }
  .sheet { position: absolute; inset: var(--s-4); z-index: 26; background: var(--panel-raised);
           border: 1px solid var(--panel-edge); border-radius: var(--r-lg);
           box-shadow: var(--shadow-lift); padding: var(--s-5); display: flex;
           flex-direction: column; gap: var(--s-3); }
  .shead { display: flex; align-items: center; gap: var(--s-3); }
  .stt { display: flex; align-items: baseline; gap: var(--s-3); min-width: 0; }
  .xbtn { width: var(--tap-min); height: var(--tap-min); flex: none; display: flex;
          align-items: center; justify-content: center; border-radius: 50%;
          background: var(--man-soft); border: 1px solid var(--line); color: var(--ink); }
  .xbtn svg { width: var(--s-5); height: var(--s-5); }
  .stitle { font-size: var(--t-title); font-weight: var(--w-heavy); color: var(--ink);
            line-height: var(--lh-tight); white-space: nowrap; }
  .sroute { font-size: var(--t-body); font-weight: var(--w-bold); white-space: nowrap; }
  .legend { display: flex; gap: var(--s-3); flex-wrap: wrap; font-size: var(--t-small);
            font-weight: var(--w-bold); color: var(--ink-2); }
  .lg { display: inline-flex; align-items: center; gap: var(--s-2); }
  /* seven states, as the mini-map's squares (item 59). Each has a colour and
     a second sign that needs no colour, for sun glare and for eyes that mix
     red and green: a check when done, a triangle on a sheet error, a triangle
     on the gold tint with passes to fix, a ban sign on stripes when not
     drivable, a --prog bar in progress. "Not started" keeps
     an --ink-3 edge and an empty bar, so it never reads as a hole. Each
     swatch is a small tile, and the legend's gap is --s-3, so it keeps
     to one line from 800px wide; with seven states it wraps to two rows
     at the 720px minimum (v0.38). */
  .sw { width: calc(var(--t-small) + var(--s-1)); height: calc(var(--t-small) + var(--s-1));
        border-radius: calc(var(--r-sm) / 2); display: inline-flex; align-items: center;
        justify-content: center; background: transparent; border: 1px solid var(--ink-3); }
  .sw.part, .cell.part { background: var(--prog-bg); border-color: var(--ink-2); }
  .sw.done, .cell.done { background: var(--ok-tile-bg); border-color: var(--ok-tile); }
  .sw.err, .cell.err { background: var(--err-bg); border-color: var(--err); }
  /* item 59: a POI with passes to fix, the gold tint with a warning triangle */
  .sw.fix, .cell.fix { background: var(--active); border-color: var(--warn); }
  .sw.nd, .cell.nd { border-color: var(--line);
                     background: repeating-linear-gradient(135deg, var(--hatch) 0 calc(var(--s-1) / 2),
                                 transparent calc(var(--s-1) / 2) var(--s-2)); }
  .sw.act, .cell.active { background: var(--active); border-color: var(--active-line); }
  .sw.act { box-shadow: inset 0 0 0 1px var(--active-line); }
  .grid { flex: 1; min-height: 0; overflow: hidden; display: grid; align-content: start;
          grid-template-columns: repeat(10, minmax(0, 1fr)); grid-auto-rows: var(--row-h);
          gap: var(--s-2);
          mask-image: linear-gradient(var(--ink) calc(100% - var(--s-3)), transparent); }
  .cell { border-radius: var(--r-sm); background: transparent; border: 1px solid var(--ink-3);
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: var(--s-2); }
  .cn { font-size: var(--t-label); font-weight: var(--w-heavy); line-height: var(--lh-tight); }
  .cb { width: 60%; height: var(--s-1); border-radius: var(--r-sm); background: var(--line);
        overflow: hidden; display: block; }
  .cell.done .cn { color: var(--ok-tile); }
  .cell.done .cb i { background: var(--ok-tile); }
  .cell.err .cn { color: var(--err); }
  .cell.err .cb i { background: var(--err); }
  .cell.nd .cn { color: var(--ink-2); }
  /* the sign takes the bar's place: its negative margins give it the bar's
     height, so the numbers of a row of tiles stay on one line */
  .cell .ci { width: var(--t-label); height: var(--t-label); flex: none;
              margin-block: calc((var(--s-1) - var(--t-label)) / 2); }
  .sw .ci { width: var(--s-3); height: var(--s-3); }
  .sw.done .ci, .cell.done .ci { color: var(--ok-tile); }
  .sw.err .ci, .cell.err .ci { color: var(--err); }
  .sw.fix .ci, .cell.fix .ci { color: var(--warn); }
  .sw.nd .ci, .cell.nd .ci { color: var(--ink-2); }
  .cell.active { box-shadow: inset 0 0 0 var(--s-1) var(--active-line); }
  .cell.active .cn { color: var(--warn); }

  /* ---- item 51: the column is wide from 1200px; the main area follows the
     shape of the app: side by side when wider than tall, stacked when taller.
     In landscape the action bar runs under both groups and holds the summary,
     and the column runs down to the bottom. These rules come last so they win
     over the component rules above. ---- */
  @container (min-width: 1200px) {
    .body { grid-template-columns: var(--col-wide) minmax(0, 1fr); }
    /* the wide column's mini-map uses larger squares, still 20 to a row */
    .dots { grid-template-columns: repeat(20, var(--s-3)); }
    .dots i { width: var(--s-3); height: var(--s-3); }
  }
  @container (orientation: landscape) {
    .body { grid-template-rows: minmax(0, 1fr); grid-template-areas: "col main"; }
    .sumport { display: none; }
    .sumbar { display: block; }
    .main { display: grid; column-gap: var(--gap); row-gap: var(--gap);
            grid-template-columns: minmax(0, 1fr) auto;
            grid-template-rows: minmax(0, 1fr) auto;
            grid-template-areas: "left zone" "bar bar"; }
    .mleft { grid-area: left; }
    .mright { grid-area: zone; width: calc(2 * var(--side-reach) + 2 * var(--s-2) + var(--disc-man)); }
    .bar { grid-area: bar; }
    .head { padding-right: 0; min-height: 0; }
    /* the free space runs from the top of the main area to the bar */
    .stagebox { top: round(max(0px, min(calc((100% + var(--gap) - 2 * var(--disc-man)) / 2),
                                        calc(100% + var(--gap) - var(--s-4) - 2 * var(--disc-man)
                                             - (var(--s-4) + round(up, calc(var(--lh-body) * var(--t-body)), 1px) + 2 * var(--s-1))))), 1px); }
    .stagebox:has(.stage.open) {
      top: round(min(calc((100% + var(--gap) - (2 * var(--side-reach) + var(--disc-side))) / 2),
                     calc(100% + var(--gap) - var(--s-2) - var(--s-1)
                          - (2 * var(--side-reach) + var(--disc-side)))), 1px); }
  }
  /* the compact card and pill: beside the discs the left group can be
     narrow; the card tightens its padding (its rings and rose follow its
     own width, item 39), and the pill shows its chevron without the word */
  @container info (max-width: 400px) {
    .card { --pad: var(--s-3); }
    .tchg span { display: none; }
  }
  /* ---- the compact step (item 70): on a short screen display text shrinks
     and the mini-map becomes a one-line grid button; discs, the compass and
     tap targets keep their size ---- */
  @container (max-height: 700px) {
    .big { font-size: var(--t-num-compact); }
    .cnt { font-size: var(--t-label); }
    .rest { font-size: var(--t-small); }
    /* half a step between the counter lines keeps them level with the smaller number */
    .hcol { gap: calc(var(--s-3) / 2); }
    .mmap { flex-direction: row; align-items: center; height: var(--tap-min);
            padding: 0 var(--s-3); }
    .mm { display: none; }
    .mline { display: flex; }
  }
  /* ---- the compact landscape step (item 70, v0.32): the side margins
     become --s-4, the gaps beside the column and the discs --s-3 and the
     closed side discs sit --s-2 nearer to Straight. The disc size, the
     vertical offsets and the open compass do not change. ---- */
  @container (max-height: 700px) and (orientation: landscape) {
    .scr { padding-left: var(--s-4); padding-right: var(--s-4); }
    .body { column-gap: var(--s-3); }
    .main { column-gap: var(--s-3); }
    .mright, .stage { width: calc(2 * var(--side-reach) + var(--disc-man)); }
    .disc.l { left: calc(50% - var(--side-reach)); }
    .disc.r { left: calc(50% + var(--side-reach)); }
    /* the caption keeps one line and its spare width in the narrower zone */
    .lock { padding-left: var(--s-2); padding-right: var(--s-2); }
  }
  /* with that width the card keeps its normal padding above and below
     instead of the compact one: from the landscape minimum of 1000px the
     left group is at least 370px wide. In a frame dragged narrower the
     compact card stays. The pill keeps its compact look. */
  @container (max-height: 700px) and (orientation: landscape) and (min-width: 1000px) {
    .card { --pad: var(--s-3); padding: var(--s-4) var(--pad); }
  }
  /* ---- the compass's sizes (item 19, v0.35): 128px, 144px on a tall
     landscape screen, 96px on a short one. The compass and the head read
     --compass, so one step sets it for both. ---- */
  @container (orientation: landscape) and (height > 700px) {
    .scr { --compass: var(--compass-wide); }
  }
  @container (max-height: 700px) {
    .scr { --compass: var(--compass-compact); }
  }
  /* ---- the roomy card (item 71, v0.36): on a tall landscape screen the
     "Still needed" card takes more padding and a larger head, so it
     does not look small and flat beside the discs. Its rings and rose
     keep the sizes its width gives them (item 39). Where the left group
     is narrower than 520px the normal card stays. ---- */
  @container (orientation: landscape) and (height > 700px) {
    @container info (width >= 520px) {
      .card { --pad: var(--s-5); }
      .spt, .lp { font-size: var(--t-body); }
    }
  }

  /* ============================================================
     HISTORY (screens.md items 12, 13, 14, 38, 41, 44, 45, 47, 48, 61,
     63, 66). The panel fills the main area of the shell above and takes
     the column's surface, so the two read as a pair. Tokens only, as
     the canon note above says.
     ============================================================ */
  .hist { flex: 1; min-height: 0; grid-area: 1 / 1 / -1 / -1; position: relative;
          display: flex; flex-direction: column; gap: var(--s-3); padding: var(--s-4);
          background: var(--panel); border: 1px solid var(--panel-edge);
          border-radius: var(--r-md); box-shadow: var(--shadow); }
  /* header: the round close button (item 66), the title, the scope control
     (item 12), a segmented control in the iOS style: a soft track with --s-1
     of inset, the chosen segment raised; radii concentric; the segments
     --s-2 apart so each is its own tap target, both as wide as the wider */
  .hh { flex: none; display: flex; align-items: center; gap: var(--s-3); }
  .ht { flex: 1; min-width: 0; margin: 0; font-size: var(--t-row); font-weight: var(--w-heavy);
        line-height: var(--lh-tight); white-space: nowrap; }
  .seg { flex: none; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: var(--s-2);
         padding: var(--s-1); background: var(--man-soft); border-radius: var(--r-md); }
  .sg { height: var(--tap-min); min-width: calc(var(--tap-min) + var(--s-6)); padding: 0 var(--s-4);
        display: inline-flex; align-items: center; justify-content: center;
        font-size: var(--t-body); font-weight: var(--w-heavy); color: var(--ink-2);
        border-radius: calc(var(--r-md) - var(--s-1)); white-space: nowrap; }
  .sg.on { background: var(--panel-raised); box-shadow: var(--shadow); color: var(--ink); }
  /* sub-header (item 41): gold chip, quiet context, neutral chip */
  .hsub { flex: none; display: flex; align-items: center; gap: var(--s-3); }
  .chip { flex: none; display: inline-flex; align-items: center; padding: var(--s-1) var(--s-2);
          border-radius: var(--r-sm); background: var(--man-soft); color: var(--ink);
          font-size: var(--t-body); font-weight: var(--w-heavy); line-height: var(--lh-tight);
          white-space: nowrap; }
  .chip.gold { background: var(--side-soft); color: var(--ink); }
  .hctx { flex: 1; min-width: 0; font-size: var(--t-small); font-weight: var(--w-bold);
          color: var(--ink-2); line-height: var(--lh-tight); white-space: nowrap; }
  /* queue line (item 13), only while removals are queued */
  .hq { flex: none; display: flex; align-items: center; gap: var(--s-2); font-size: var(--t-small);
        font-weight: var(--w-bold); color: var(--ink-2); line-height: var(--lh-tight);
        white-space: nowrap; }
  .hq .dot { background: var(--warn); }
  /* the list: a grid whose columns are shared by every row, so the POI
     number and the time each sit in one fixed slot as wide as the widest. A
     row element has no box of its own (display: contents): its lines are
     items of the list's grid and the subgrid reaches every one of them. The
     first line is --row-h tall with a hairline, as the POI rows beside it;
     its content is --tap-min tall, --s-1 under the row's top, so the "Delete"
     button and the texts land on whole pixels. The texts share a baseline
     inside their own block; each is trimmed to its cap height and baseline,
     so the block's centre is the ink's centre. A whole row sits at the top
     edge, the cut row at the bottom fades (item 56). */
  .hlist { flex: 1; min-height: 0; overflow: hidden; overflow-anchor: none; display: grid; align-content: start;
           column-gap: var(--s-2);
           grid-template-columns: [time] max-content [side] minmax(0, 1fr) [label] max-content [act] max-content;
           mask-image: linear-gradient(var(--ink) calc(100% - var(--s-3)), transparent); }
  .hlist[data-scope="route"] { grid-template-columns: [num] max-content [time] max-content [side] minmax(0, 1fr) [label] max-content [act] max-content; }
  .hlist.end { mask-image: none; padding-bottom: var(--row-h); }
  .hr { display: contents; }
  .hl1 { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center;
         height: var(--row-h); padding-top: var(--s-1);
         padding-bottom: calc(var(--row-h) - var(--tap-min) - var(--s-1) - 1px);
         border-bottom: 1px solid var(--line); }
  .htx { grid-column: 1 / -2; display: grid; grid-template-columns: subgrid; align-items: baseline; }
  .hn, .htm, .hmv, .hst { text-box: trim-both cap alphabetic; }
  .hn { font-size: var(--t-row); font-weight: var(--w-heavy); line-height: var(--lh-tight);
        text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .htm { font-size: var(--t-body); font-weight: var(--w-medium); color: var(--ink-2);
         line-height: var(--lh-tight); text-align: right; font-variant-numeric: tabular-nums;
         white-space: nowrap; }
  .hmv { min-width: 0; font-size: var(--t-label); font-weight: var(--w-heavy); line-height: var(--lh-tight);
         white-space: nowrap; }
  /* the inline icon sits centred on the cap height, as in the card's tiles */
  .hmv .ic { display: inline-block; vertical-align: -0.15em; margin-right: var(--s-1); }
  .hst { font-size: var(--t-small); font-weight: var(--w-heavy); color: var(--ink-2);
         line-height: var(--lh-tight); white-space: nowrap; }
  .hst.wait { color: var(--ink); }
  .hst .dot { display: inline-block; vertical-align: calc(0.5cap - var(--s-1)); margin-right: var(--s-1);
              background: var(--warn); }
  .hst.rej { color: var(--err); }
  /* a type change (items 12, 47): no maneuver icon, the type in --t-body.
     Where the slot is narrow (720 x 1000 in Route scope) it wraps after
     "Type:", and the type's own name never breaks */
  .hmv.ty { font-size: var(--t-body); white-space: normal; }
  .hmv.ty span { white-space: nowrap; }
  /* "Delete" (items 13, 28): red text on the red tint, at the right edge, a
     tap target; the filled red button stays reserved for the dialog. Its box
     is --tap-min + --s-5 wide: --s-3 of padding less the hairline keeps the
     word inside that width, so the box lands on whole pixels. */
  .hdel { align-self: center; justify-self: end; display: inline-flex; align-items: center;
          justify-content: center; height: var(--tap-min); min-width: calc(var(--tap-min) + var(--s-5));
          padding: 0 calc(var(--s-3) - 1px); font-size: var(--t-body); font-weight: var(--w-bold);
          color: var(--err); background: var(--err-bg); border: 1px solid var(--line);
          border-radius: var(--r-sm); white-space: nowrap; }
  /* a deleted pass (items 12, 13, 38): struck through, labelled, not dimmed,
     with "Cancel removal" under it while its removal waits */
  .hr.del .htm, .hr.del .hmv { text-decoration: line-through; }
  /* a refused pass (item 47): three lines with --s-3 above and below, the
     reason as a sentence, its two actions at the right edge, never on the
     line with the time; the hairline closes the row under the actions. A
     deleted pass has the same first line, so its action sits under it too */
  .hr.rej .hl1, .hr.del .hl1 { height: var(--tap-min); padding: 0; border: 0; margin-top: var(--s-3); }
  .hwhy { grid-column: 1 / -1; margin: var(--s-2) 0 0; font-size: var(--t-small); font-weight: var(--w-medium);
          color: var(--ink-2); line-height: round(up, calc(var(--lh-body) * var(--t-small)), 1px);
          text-wrap: balance; }
  .hacts { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: var(--s-2);
           margin-top: var(--s-2); padding-bottom: var(--s-3); border-bottom: 1px solid var(--line); }
  .hacts .btn { min-width: calc(3 * var(--tap-min) - var(--s-6)); justify-content: center; }
  /* the end of the list (item 48) and the empty state (items 14, 45) */
  .hend { grid-column: 1 / -1; margin: 0; padding: var(--s-4) var(--s-3); text-align: center;
          font-size: var(--t-small); font-weight: var(--w-medium); color: var(--ink-2);
          line-height: round(up, calc(var(--lh-body) * var(--t-small)), 1px); }
  .hend span { display: block; white-space: nowrap; }
  .hlist.empty { display: flex; align-items: center; justify-content: center; mask-image: none; }
  .hempty { display: flex; flex-direction: column; gap: var(--s-2); text-align: center;
            max-width: 40ch; }
  .hempty b { font-size: var(--t-label); font-weight: var(--w-heavy); line-height: var(--lh-tight);
              white-space: nowrap; }
  .hempty p { margin: 0; font-size: var(--t-small); font-weight: var(--w-medium); color: var(--ink-2);
              line-height: round(up, calc(var(--lh-body) * var(--t-small)), 1px); text-wrap: balance; }
  /* footer (items 14, 45) */
  .hfoot { flex: none; margin: 0; padding-top: var(--s-1); text-align: center; font-size: var(--t-small);
           font-weight: var(--w-medium); color: var(--ink-2); line-height: var(--lh-tight);
           white-space: nowrap; }

  /* ============================================================
     APP ONLY: motion, the toast, scrolling and the states the static
     references draw as separate frames or not at all. Tokens only
     (screens.md item 68).
     ============================================================ */
  .app { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* the overlays container takes no place in .scr's flex column: an empty
     in-flow item still adds one gap under .body, 18 px the reference has
     not. Its overlays stay absolute against .scr, as before, and the toast
     below is absolute too, out of the flow by its own rule. */
  #overlays { display: contents; }
  .main.histopen > :not(.hist) { display: none !important; }
  .list, .grid, .hlist { overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain; }
  .list::-webkit-scrollbar, .grid::-webkit-scrollbar, .hlist::-webkit-scrollbar { display: none; }
  /* the last row of History scrolls clear of the fade at the list's foot */
  .hlist:not(.empty)::after { content: ""; grid-column: 1 / -1; height: var(--s-3); }
  .rail { touch-action: none; }
  .stage:not(.open) .side { display: none; }
  .disc { transition: left var(--dur-move) var(--ease-out), top var(--dur-move) var(--ease-out),
                      opacity var(--dur-fade) var(--ease-out); }
  .disc:active:not(.locked) { scale: var(--scale-press); }
  .side { animation: bloom var(--dur-move) var(--ease-out) both; }
  /* items 7 and 62: the tapped side dips in place while a gold ring, its
     ::after, leaves it like a sonar ping */
  .side.ring { animation: dip var(--dur-dip) var(--ease-out) both; }
  .side::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
                 box-shadow: 0 0 0 var(--s-1) var(--side); opacity: 0; pointer-events: none; }
  .side.ring::after { animation: sonar var(--dur-ring) var(--ease-out) both; }
  @keyframes bloom { from { opacity: 0; scale: var(--scale-bloom); } to { opacity: 1; scale: 1; } }
  @keyframes dip { 0% { scale: 1; } 40% { scale: var(--scale-dip); } 100% { scale: 1; } }
  @keyframes sonar { from { scale: 1; opacity: 1; } to { scale: var(--scale-ring); opacity: 0; } }

<script>
(function () {

  var SCHEMA = 1;                    // the layout of the store; migrate() brings older ones up

  var SAMPLE_ID = 'sample';          // the reserved id of the sample city
  var OPEN_TIMEOUT = 12000;          // item 8: the open compass closes after 12 s

    nost: { label: 'No straight',   target: 70, split: { L: 35, St: 0, R: 35 }, cap: 'No straight at this POI' },
    nol:  { label: 'No left',       target: 70, split: { L: 0, St: 14, R: 56 }, cap: 'No left turn at this POI' },

    str:  { label: 'Straight only', target: 40, split: { L: 0, St: 40, R: 0 }, cap: 'Straight only at this POI', side: 20 },

  function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }

  // S = { schema, seq, device: { cityId, theme, sound }, cities: [city],
  //       baseline: { routeId: { poi: { c: [N, S, W, E, L, St, R], target } } },
  //       types: { routeId: { poi: type } }, events: [event],
  //       dropped: { routeId: { poi: 1 } } }
  // An event: { id, seq, ts, city, route, routeId, poi, kind: 'pass' | 'target',

  //   posted stay on the tablet. dropped records the scopes the 3,000 limit
  //   trimmed, for the line of item 48.
  var S = null;
  var lastJson = null;   // the store as last written: a failed change goes back to it

    IX = null;
    full(what);
    return false;
  }

  // they were even when a choice of view could not be saved

    var v = { cityId: S.device.cityId, lastRoute: {}, lastPoi: {} };
    S.cities.forEach(function (c) {

      c.routes.forEach(function (r) { v.lastPoi[r.id] = r.lastPoi; });

  }

    if (cityById(v.cityId)) S.device.cityId = v.cityId;
    S.cities.forEach(function (c) {
      if (v.lastRoute.hasOwnProperty(c.id)) c.lastRoute = v.lastRoute[c.id];

  function quietSave() {
    if (!writable) return;
    var json = JSON.stringify(S);
    try { localStorage.setItem(KEY, json); lastJson = json; } catch (err) { /* kept in memory */ }
  }

  // ================= reading the store =================
  // The index of the events: the waiting deltas per POI, the removal of each

  // the card (item 39): under its heading TO GO, the maneuvers as progress
  // rings in a pyramid, Left and Right low and Straight on top, and the
  // sides as a rose of four diamonds, N above, E right, S below, W left:
  // the markup of main-screen.html frames A, D, E, G and N. At the head's
  // right the last pass of the POI, the one Undo last would remove (item
  // 9), so it follows the active POI, a new pass and an undo.
  function renderCard() {

      var when = stamp(last.ts);
      head += '<span class="lp" role="img" aria-label="Last pass: ' + MAN_NAME[last.man] + ' from ' + SIDE_NAME[last.side] + ' at ' + when + '">' +
        '<span class="spt">LAST</span>' + icon(MAN_ICON[last.man]) + last.side + ' · ' + when + '</span>';
    }
    var rings = MANS.map(function (m) {
      var share = T ? T.split[m] : 0, have = k.m[m], cls = 'mz' + (m === 'St' ? '' : ' low'), val, fill;
      // item 39: a maneuver the type does not allow fades with a dash on an
      // empty track while it has no passes; with passes it reads "+26 over"
      // below, like a count past a share (frames S and T)
      if (!share && !(have > 0)) { cls += ' off'; val = '<b class="rv">—</b>'; fill = 0; }
      else if (have < share) { val = '<b class="rv">' + (share - have) + '</b><small>more</small>'; fill = Math.round(Math.max(have, 0) / share * 100); }

      var svg = '<svg class="pg" viewBox="0 0 76 76" aria-hidden="true"><circle class="bg" cx="38" cy="38" r="33" stroke-width="6"/>' +
        (fill > 0 ? '<circle class="fg" cx="38" cy="38" r="33" stroke-width="6" pathLength="100" stroke-dasharray="' + fill + ' 100"/>' : '') + '</svg>';
      return '<div class="' + cls + '"><div class="wheel">' + svg + '<div class="in">' + val + '</div></div>' +
        '<span class="mn">' + icon(MAN_ICON[m]) + MAN_NAME[m] + '</span></div>';
    }).join('');

      }

        (of ? '<small class="of">' + of + '</small>' : '') + '</div></div>';
    }).join('');
    setHTML($('card'), '<div class="khead">' + head + '</div><div class="two"><div class="pyr">' + rings + '</div>' +
      '<div class="rose"><div class="grid4">' + rose + '</div></div></div>');
  }

  // ---- History (items 12, 13, 14, 38, 41, 44, 45, 47, 48) ----
  // the reason line under a refused row, in the words of its own row (item 47)

    var c = cityById(e.city), r = routeById(e.routeId), name = c ? c.name : 'This city';
    var undoWords = kind === 'pass' ? 'delete this pass' : kind === 'removal' ? 'cancel the removal' : 'cancel the change';
    switch (e.reason) {
      case 'text-in-cell': return 'The sheet has text in a cell this ' + (kind === 'removal' ? 'removal takes from' : 'pass adds to') + '. Fix the cell, then send again.';
      case 'no-route': return r && !r.checked ? name + '’s sheet has no tab named ' + e.route + '. Correct the route code in Settings.'
        : name + '’s sheet has no tab named ' + e.route + '. Rename the route’s tab to ' + e.route + ', then send again.';
      case 'no-poi': return 'Tab ' + e.route + ' has no row for POI ' + e.poi + '. Add the row in the sheet, then send again, or ' + undoWords + '.';
      case 'below-zero': return 'The sheet’s count is already 0, so there is nothing left to remove.';
      case 'already-removed': return 'The sheet already took this pass out. Cancel this removal.';
      case 'bad-request': case 'bad-target': return 'The sheet could not read this change. Send it again or ' + (kind === 'pass' ? 'delete it' : undoWords) + '.';
      default: return 'The sheet could not write this change. Send it again.';

  }

    renderColumn();
    list = $('col').querySelector('.list'); if (list) list.scrollTop = keep;
  });

  // ---- the screen stays awake (item 11): at start, on every return to view;
  // a refusal is silent ----
  var wake = null;
  function keepAwake() {
    try {
      if (wake || !navigator.wakeLock || document.visibilityState !== 'visible') return;
      navigator.wakeLock.request('screen').then(function (s) {
        wake = s;
        s.addEventListener('release', function () { wake = null; });
      }).catch(function () { /* refused: fine */ });
    } catch (err) { /* not available */ }
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') keepAwake(); });
  document.addEventListener('pointerdown', keepAwake, true);

  // ================= the compass (item 19): step 2 is a stub =================
  // The sensors of data-model.md "Heading" (prototype v19.7) come in step 3
  // as a module with this same interface: start(onChange) and stop(), where
  // onChange gets { deg, pale }. The stub shows the course the tablet saved
  // last, or north when nothing is saved, pale.
  var Compass = (function () {
    function start(onChange) {
      var deg = 0;
      try {
        var s = JSON.parse(localStorage.getItem(HEADING_KEY) || 'null');
        if (s && typeof s.deg === 'number' && isFinite(s.deg)) deg = ((s.deg % 360) + 360) % 360;
      } catch (err) { /* nothing saved: north */ }
      onChange({ deg: deg, pale: true });
    }
    function stop() { /* nothing runs in the stub */ }
    return { start: start, stop: stop };
  }());
  function drawCompass(h) {
    var svg = document.querySelector('.app svg.compass');
    if (!svg) return;
    var deg = Math.round(h.deg * 10) / 10;
    svg.querySelector('.arrow').setAttribute('transform', 'rotate(' + deg + ' 48 48)');
    svg.classList.toggle('idle', !!h.pale);
    svg.setAttribute('aria-label', 'Heading ' + Math.round(h.deg) + ' degrees' + (h.pale ? ', not checked yet' : ''));
  }

  // ================= the sample city: only through ?sample =================
  // Distributes c over keys in proportion to the weights, whole numbers.
  function spread(c, keys, weights) {
    var total = 0, out = {}, given = 0;
    keys.forEach(function (k) { total += weights[k]; });
    keys.forEach(function (k) { out[k] = total ? Math.floor(c * weights[k] / total) : 0; given += out[k]; });
    var i = 0;
    while (given < c && total) { var k = keys[i % keys.length]; if (weights[k] > 0) { out[k] += 1; given += 1; } i += 1; }
    return out;
  }
  // the route of the references (main-screen.html), POI 136 active
  function sample001(n) {
    if (n === 57) return { t: 'int', m: { L: 18, St: 9, R: 17 }, s: { N: 18, S: 14, W: 9, E: 5 } };
    if (n === 168) return { t: 'nd', c: 0 };
    if (n === 122) return { t: 'int', m: { L: 26, St: 13, R: 27 }, c: 66 };
    if (n === 124) return { t: 'int', m: { L: 28, St: 13, R: 27 }, s: { N: 24, S: 20, W: 14, E: 10 } };
    if (n === 135) return { t: 'int', m: { L: 28, St: 14, R: 28 }, s: { N: 25, S: 21, W: 14, E: 10 } };
    if (n === 136) return { t: 'int', m: { L: 16, St: 8, R: 17 }, s: { N: 16, S: 14, W: 11, E: 0 } };
    if (n === 138) return { t: 'nost', m: { L: 15, St: 0, R: 15 }, s: { N: 12, S: 9, W: 6, E: 3 } };
    if (n <= 48) return { t: 'int', c: 70 };
    var t = n % 19 === 0 ? 'str' : (n % 23 === 0 ? 'nost' : 'int');
    var T = TYPES[t].target, k = (n * 37) % 23;
    if (k < 5) return { t: t, c: T };
    if (k < 9) return { t: t, c: 0 };
    return { t: t, c: 1 + ((n * 11) % (T - 1)) };
  }
  function sample002(n) {
    var t = n % 19 === 0 ? 'str' : (n % 23 === 0 ? 'nost' : 'int');
    return { t: t, c: n <= 60 ? TYPES[t].target : 0 };
  }
  function fillRoute(r, gen) {
    var bl = S.baseline[r.id] = {}, ty = S.types[r.id] = {};
    for (var n = 1; n <= r.poiCount; n++) {
      var p = gen(n), sp = TYPES[p.t].split;
      var m = p.m || spread(p.c, MANS, sp);
      var c = m.L + m.St + m.R;
      var s = p.s || spread(c, SIDES, { N: 3 + (n * 7) % 5, S: 3 + (n * 3) % 4, W: 2 + (n * 5) % 4, E: 1 + (n * 11) % 3 });
      bl[n] = { c: [s.N, s.S, s.W, s.E, m.L, m.St, m.R], target: TYPES[p.t].target };
      if (BY_TARGET[TYPES[p.t].target] !== p.t) ty[n] = p.t;
    }
  }
  function seedSample() {
    if (cityById(SAMPLE_ID)) { change(function () { S.device.cityId = SAMPLE_ID; }, 'change'); return; }
    change(function () {
      var now = Date.now(), MIN = 60000;
      var r1 = { id: uuid(), code: 'SAMPLE-001', poiCount: 197, checked: true, loadedAt: now - 29 * 60 * MIN, lastPoi: 136 };
      var r2 = { id: uuid(), code: 'SAMPLE-002', poiCount: 150, checked: true, loadedAt: now - 29 * 60 * MIN, lastPoi: null };
      S.cities.push({ id: SAMPLE_ID, name: 'Sample city', sample: true, mailboxUrl: null, token: null, routes: [r1, r2],
                      lastRoute: r1.id, testedAt: null, testResult: null, sentAt: null, keyRejected: false });
      fillRoute(r1, sample001);
      fillRoute(r2, sample002);
      // passes this tablet recorded earlier, all delivered and inside the
      // baseline already (history.html frame A)
      [[136, 'L', 'S', 2], [136, 'R', 'N', 4], [136, 'St', 'W', 11], [136, 'L', 'N', 15], [136, 'R', 'S', 20],
       [136, 'L', 'W', 24], [136, 'St', 'N', 30], [136, 'R', 'W', 35], [136, 'L', 'S', 41], [136, 'R', 'N', 46],
       [135, 'R', 'E', 52], [135, 'L', 'S', 55], [135, 'St', 'N', 59], [135, 'R', 'W', 63], [135, 'L', 'E', 68],
       [134, 'L', 'N', 74], [134, 'R', 'S', 78], [134, 'St', 'W', 83], [133, 'St', 'N', 1440 + 62],
       [133, 'St', 'S', 1440 + 66], [133, 'St', 'N', 1440 + 71], [132, 'L', 'E', 1440 + 80]
      ].reverse().forEach(function (f) {
        S.seq += 1;
        S.events.push({ id: uuid(), seq: S.seq, ts: now - f[3] * MIN, city: SAMPLE_ID, route: r1.code, routeId: r1.id, poi: f[0],
                        kind: 'pass', side: f[2], man: f[1], delta: 1, state: 'delivered' });
      });
      S.device.cityId = SAMPLE_ID;
    }, 'change');
  }

  // ================= start =================
  function applyTheme() {
    var t = S.device.theme;
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
  }
  // takes the Web Lock on the store: a second tab of the app gets none,
  // shows a banner and records nothing (data-model.md "Tablet storage")
  function takeLock(then) {
    var done = false;
    function once(ok) { if (!done) { done = true; then(ok); } }
    if (!navigator.locks || !navigator.locks.request) { once(true); return; }
    try {
      navigator.locks.request(KEY, { ifAvailable: true }, function (lock) {
        once(!!lock);
        if (lock) return new Promise(function () { /* held while this page lives */ });
      }).catch(function () { once(true); });
    } catch (err) { once(true); }
  }

  load();
  // v0.15, temporary: ?lab=0 to ?lab=4 draws a locked disc another way for
  // this page load and names the variant after the city; any other value
  // changes nothing. Read before ?sample strips the address.
  var lab = /(^|&)lab=([0-4])(&|$)/.exec(location.search.slice(1));
  if (lab) {
    document.documentElement.classList.add('lab-' + lab[2]);
    $('city').insertAdjacentHTML('afterend', '<span class="lab" id="lab">Test ' + lab[2] + '</span>');
  }
  var wantSample = /(^|[?&])sample(=|&|$)/.test(location.search.slice(1));
  if (wantSample) { try { history.replaceState(history.state, '', location.pathname + location.hash); } catch (err) { /* fine */ } }
  applyTheme();
  render();
  Compass.start(drawCompass);
  keepAwake();
  takeLock(function (ok) {
    if (!ok && !blocked) blocked = 'tab';
    writable = ok && !blocked;
    if (writable) {
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { /* fine */ }); } catch (err) { /* fine */ }
      if (wantSample) seedSample();
    }
    render();
    if (route()) requestAnimationFrame(function () { centreList(active()); });
  });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* the page still works online */ }); });
  }
}());
</script>
