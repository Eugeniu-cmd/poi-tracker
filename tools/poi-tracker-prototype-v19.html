<!doctype html>
<!--
  POI Tracker — working prototype v19.4
  One file, for the tablet. Open it in Chrome from GitHub Pages
  (tools/poi-tracker-prototype-v19.html): a downloaded copy gets no
  location, and the compass needs it.

  The look is the approved references, copied, not redrawn:
  - the app CSS of docs/references/main-screen.html v0.31 and the History
    rules of docs/references/history.html v0.9, byte for byte
  - docs/references/_tokens.css v0.13, inlined so the file works alone
  - the Lucide sprite of main-screen.html
  What this file adds is behaviour: sample routes, tapping passes, the
  compass that blooms, undo and delete with their dialogs, History, the
  type menu, the route menu, the grid, the rail, a simulated sync, and the
  live compass from the tablet's sensors (data-model.md "Heading").
  Nothing is sent anywhere. The tablet keeps two things in the browser's
  storage: the compass's last course, and the sensor log, the last 3
  drives, no coordinates, until "Save sensor logs" in Tools turns them
  into one file.

  v17 2026-10-12 — first prototype on the canon: main-screen v0.24,
          history v0.9, tokens v0.11, screens v0.35. Replaces the
          prototype v16 of 2026-10-06.
  v18 2026-10-12 — the car test of v17: the Lenovo Tab M10 Plus (3rd Gen)
          has no magnetometer, so the compass now takes the GPS course
          and carries it through stops with the gyroscope. The Tools menu
          shows each source's state. The sync panel (decided 2026-10-12),
          "No connection" (item 34), "Removal waiting" in History, the
          amber chip in ink, and the real network as well as the switch.
  v19 2026-10-17: the car tests of 2026-10-17 (project doc
          claude/tablet-sensor-test-2026-10-17.md): the compass takes the
          GPS course from 11 km/h and carries it with the raw gyroscope
          (Generic Sensor API, devicemotion as the fallback), turned about
          "up" from the accelerometer. A sensor counts only with a reading
          in the last second. Location is asked before the motion sensors
          start, and the sensors restart when the page comes back. No
          magnet and no offset. Tools shows the sensors, the pauses and
          how they ended, and saves a sensor log. Working screen from
          main-screen v0.27: the gear (item 73, Settings come in v20),
          "Last sent", "last loaded", "79 of 196 done" counting drivable
          POIs (item 46), and a tap outside an open menu only closes it
          (item 66). "Sheet" on screen, never "tracker".
  v19.1 2026-10-17: the car test of v19 (claude/prototype-v19.md). The
          GPS course lags the car by 2 to 3 s in a turn, and v19 took it as
          north at every fix, mid-turn too. Now the gyroscope drives the
          needle all the time and GPS checks north only while the car
          drives straight above 11 km/h, closing 30% of the gap per fix
          (a gap over 30 degrees at once). Tools adds "GPS checks". On the
          log of the test drive the error after a manoeuvre falls from a
          mean of 24.5 degrees (worst 62) to 8 (worst 13).
  v19.2 2026-10-18: the compass of main-screen v0.29 (screens.md v0.42,
          tokens v0.12): one arrow on a raised round face, its left half
          dark like the maneuver discs and its right half amber like the
          side discs, on a fixed dial. No heading yet: no arrow. Only a
          last known course: the arrow is pale. "Compass dial" leaves
          Tools. The drift is measured from half-second averages of the
          gyroscope while the car stands: in v19.1 the engine's shake kept
          it from ever being measured. A turn above 0.5 degrees a second
          is no longer taken for drift, so a car creeping round a corner
          while GPS reads 0 cannot bend the compass. Tools shows the turn
          averaged over half a second. The sensor log is kept on the
          tablet every 10 s, the last 3 drives, and a page opened again
          within 10 min continues the same drive: the log of 2026-10-17
          was lost with the page. Tools shows the drift being measured
          and where the log is.
  v19.3 2026-10-18: the side of a pass is the direction the car drives
          as it enters the intersection, the user's rule: driving north
          and turning right is North Right. Tools and the compass's label
          said "coming from", the opposite side. They now name the side
          the arrow points to.
  v19.4 2026-10-18: the compass arrow is always on the dial (screens.md
          v0.45, data-model.md v0.14). The tablet saves the course every
          2 s and when the page goes away. A new start shows it pale and
          the gyroscope turns it until the first GPS check. With nothing
          saved it points north, pale. The look of main-screen v0.31:
          a POI in progress is blue, done, sheet error and not drivable
          carry a sign in the grid, and dialog buttons are smaller.
-->

/* POI Tracker — design tokens.
   v0.13 — 2026-10-18

   oddities settled: --active-line now points to --side (one amber), the

<style>
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  .host { position: fixed; inset: 0; }
  /* APP START */
  /* ============================================================
     THE APP SCREEN — canon only (screens.md item 68, CLAUDE.md rule 9).
     Every colour, size, spacing, radius, opacity, shadow, weight and
     line height below is a var() from _tokens.css v0.13 or a calc() over
     them. Literal values are limited to 0, 1px hairlines, 50% for round
     shapes, percentages and fr of a layout, em, ch, lh and cap ratios of
     a token font size, keywords, SVG geometry, the 1200px breakpoint of
     item 51, the 700px height of the compact step (item 70), the 400px
     width of the compact card, the 1000px width of the compact landscape
     card (v0.22) and the 520px width of the roomy card (item 71). Icons
     are Lucide symbols (rule 10, item 69); an inline icon is 1em of its
     text. A chevron's path ends
     inside its 24-unit box (chevron-down at 18/24, chevron-right at
     15/24, check at 20/24), so a negative em margin of that remainder
     puts the drawn end, not the box, on the padding. Line boxes that set
     a block's height are rounded up to whole pixels.
     ============================================================ */
  .app { position: relative; container-type: size; width: 100%; height: 100%;
         overflow: hidden; background: var(--bg); background-image: var(--bg-grad);
         font-family: var(--font); font-size: var(--t-body); font-weight: var(--w-medium);
         line-height: var(--lh-body); color: var(--ink); }
  /* .app is the container the queries measure: no padding, so its box is the
     frame. .scr inside it carries the padding and the stack, and is the
     containing block of the menus and the compass. */
  .scr { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column;
         gap: var(--gap);
         padding: var(--s-4) var(--s-5) calc(var(--s-5) + env(safe-area-inset-bottom, 0px)); }
  .app *, .app *::before, .app *::after { box-sizing: border-box; }
  :where(.app) button { font: inherit; color: inherit; background: none; border: 0; padding: 0;
                        margin: 0; cursor: pointer; text-align: left; }
  .app svg { display: block; }
  .ic { width: 1em; height: 1em; flex: none; }
  .iw { display: inline-flex; align-items: center; gap: var(--s-1); white-space: nowrap; }
  /* tabular figures only where numbers stand in a column; rail labels are
     centred one under another, so they keep proportional figures and their
     ink keeps clear of the finger pad */
  .rn, .rt, .cn, .ritem small { font-variant-numeric: tabular-nums; }

  /* ---- top bar (items 1, 16) ---- */
  .topbar { display: flex; align-items: center; gap: var(--s-3); flex: none; }
  .city { font-size: var(--t-label); font-weight: var(--w-heavy); line-height: var(--lh-tight);
          color: var(--ink); }
  .pickwrap { anchor-name: --pick; }
  .route, .sync { display: inline-flex; align-items: center; gap: var(--s-2);
                  height: var(--tap-min); padding: 0 var(--s-4); background: var(--panel-strong);
                  border: 1px solid var(--panel-edge); border-radius: var(--r-sm);
                  box-shadow: var(--shadow); white-space: nowrap; }
  .route { font-size: var(--t-label); font-weight: var(--w-heavy); }
  .sync { margin-left: auto; font-size: var(--t-body); font-weight: var(--w-medium); }
  .route .ic { margin-right: -0.25em; }
  .sync .ic { margin-right: -0.375em; }
  /* the gear (item 73): a square tap target on the sync control's surface */
  .gear { flex: none; display: inline-flex; align-items: center; justify-content: center;
          width: var(--tap-min); height: var(--tap-min); background: var(--panel-strong);
          border: 1px solid var(--panel-edge); border-radius: var(--r-sm);
          box-shadow: var(--shadow); color: var(--ink); }
  .gear svg { width: var(--s-5); height: var(--s-5); }
  .dot { width: var(--s-2); height: var(--s-2); border-radius: 50%; background: var(--ok); flex: none; }
  /* the sync control anchors the Sync panel (item 72). Its dot follows the
     queue: waiting in the warning colour (item 33), a refused pass in the
     error colour (item 47), no connection in the muted colour (item 34) */
  .sync { anchor-name: --sync; }
  .sync.wait .dot { background: var(--warn); }
  .sync.bad .dot { background: var(--err); }
  .sync.off .dot { background: var(--ink-3); }

  /* ---- menus (items 1, 60, 66): one build for both. Anchored --s-2 under
     their control and snapped to whole pixels; a menu that does not fit
     there moves up just enough to keep --s-5 and the safe-area inset from
     the frame's bottom. The checking tool re-creates an open menu when a
     preset or theme changes, as the app closes menus when the screen
     turns, so the position never depends on the order of clicks. ---- */
  @position-try --shift { top: auto; bottom: calc(var(--s-5) + env(safe-area-inset-bottom, 0px)); }
  .rmenu, .pop { position: absolute; background: var(--panel-raised);
                 border: 1px solid var(--panel-edge); border-radius: var(--r-md);
                 box-shadow: var(--shadow-lift); padding: var(--s-2);
                 position-try-fallbacks: --shift; }
  .rmenu { z-index: 30; left: round(anchor(--pick left), 1px);
           top: calc(anchor(--pick bottom) + var(--s-2)); width: var(--col-wide); }
  /* the type menu is as wide as the pill, and at least as wide as its split
     lines need on one line; sized, not inset, so a position fallback can apply */
  .pop { z-index: 9; left: anchor(--pill left); top: calc(anchor(--pill bottom) + var(--s-2));
         width: max(anchor-size(--pill width), calc(var(--col-wide) + 2 * var(--s-6))); }
  .ritem, .opt { width: 100%; min-height: var(--tap-min); display: flex; align-items: center;
                 gap: var(--s-3); padding: var(--s-2);
                 border-radius: calc(var(--r-md) - var(--s-2) - 1px); }
  .ritem b { flex: 1; font-size: var(--t-label); font-weight: var(--w-heavy); }
  .ritem small { font-size: var(--t-small); font-weight: var(--w-medium); color: var(--ink-2); }
  .chk { width: 1em; height: 1em; flex: none; font-size: var(--t-label); color: var(--ink);
         visibility: hidden; margin-right: -0.167em; }
  .ritem.on, .opt.on { background: var(--active); }
  .ritem.on .chk, .opt.on .chk { visibility: visible; }
  .ritem.on small, .opt.on .ol small { color: var(--ink); }
  .pt { font-size: var(--t-small); letter-spacing: calc(var(--s-1) / 2);
        font-weight: var(--w-heavy); color: var(--ink-2); line-height: var(--lh-tight);
        padding: var(--s-2) var(--s-2) var(--s-3); }
  .ol { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--s-1); }
  .ol b { font-size: var(--t-label); font-weight: var(--w-heavy); line-height: var(--lh-tight); }
  /* ---- the Sync panel (item 72): under the sync control, right edges
     aligned, built like the type menu. The state's line wraps. A control
     that cannot act dims its label and keeps its reason legible ---- */
  .pop.syncpop { z-index: 30; left: auto; right: anchor(--sync right);
                 top: calc(anchor(--sync bottom) + var(--s-2));
                 width: calc(var(--col-wide) + 2 * var(--s-6)); }
  .sstat { display: flex; align-items: flex-start; gap: var(--s-3);
           padding: var(--s-2) var(--s-2) var(--s-3); }
  .sstat .dot { margin-top: round(down, calc((var(--t-label) - var(--s-2)) / 2), 1px); }
  .sstat.wait .dot { background: var(--warn); }
  .sstat.bad .dot { background: var(--err); }
  .sstat.off .dot { background: var(--ink-3); }
  .sstat .ol small { display: block; line-height: round(up, calc(var(--lh-body) * var(--t-small)), 1px); }
  .sdiv { height: 1px; margin: var(--s-2); background: var(--line); }
  .syncpop .opt.off b { opacity: var(--o-off); }
  .syncpop .go { width: 1em; height: 1em; flex: none; font-size: var(--t-label); color: var(--ink-2); }

  /* ---- body: the POI column beside the main area (items 51, 56); the
     summary under the main area in portrait (item 3) ---- */
  .body { position: relative; flex: 1; min-height: 0; display: grid; gap: var(--gap);
          grid-template-columns: var(--col-narrow) minmax(0, 1fr);
          grid-template-rows: minmax(0, 1fr) auto;
          grid-template-areas: "col main" "col sum"; }
  .colwrap { grid-area: col; position: relative; min-height: 0; display: flex; }
  /* the rail's touch area also takes in the gap beside the column (item 57) */
  .colwrap::after { content: ""; position: absolute; top: 0; bottom: 0; left: 100%;
                    width: var(--gap); }
  .col { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column;
         background: var(--panel); border: 1px solid var(--panel-edge);
         border-radius: var(--r-md); box-shadow: var(--shadow); overflow: hidden; }
  .main { grid-area: main; min-width: 0; min-height: 0; anchor-name: --main;
          display: flex; flex-direction: column; gap: var(--gap); }
  /* the left group is a container: the card and the pill go compact when it is narrow */
  .mleft { flex: none; display: flex; flex-direction: column; gap: var(--gap); min-width: 0;
           container-type: inline-size; container-name: info; }
  .mright { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  /* the summary is one balanced block; every "·" belongs to the unit before
     it and a segment never breaks. Its line height is --lh-body rounded up to
     an even number of pixels, so it centres in the action bar on a whole pixel
     and the blocks around it land on whole pixels. The portrait copy
     sits under the main area, the landscape copy inside the action bar. */
  .summary { display: block; text-align: center; text-wrap: balance; column-gap: var(--s-1);
             font-size: var(--t-small); font-weight: var(--w-medium); color: var(--ink-2);
             line-height: round(up, calc(var(--lh-body) * var(--t-small)), 2px);
             min-height: 1lh; }
  .summary span { white-space: nowrap; }
  .summary .err { color: var(--err); font-weight: var(--w-bold); }
  .sumport { grid-area: sum; }
  .sumbar { display: none; flex: 1; min-width: 0; }

  /* ---- mini-map, the column's header (item 58); on a short screen a
     one-line grid button in its place (item 70) ---- */
  .mmap { flex: none; width: 100%; padding: var(--s-3); background: var(--panel-strong);
          border-bottom: 1px solid var(--line); display: flex; flex-direction: column;
          align-items: center; }
  .mm { display: flex; flex-direction: column; gap: var(--s-2); }
  .dots { display: grid; grid-template-columns: repeat(20, var(--s-2)); gap: 1px; }
  .dots i { display: block; width: var(--s-2); height: var(--s-2); background: var(--line); }
  .dots i.done { background: var(--ok); }
  .dots i.err { background: var(--err); }
  .dots i.part { background: var(--prog); }
  .dots i.nd { background: repeating-linear-gradient(135deg, var(--ink-3) 0 1px,
                           transparent 1px calc(var(--s-1) - 1px)); }
  .dots i.act { background: var(--side); box-shadow: 0 0 0 1px var(--side-ring); }
  .mcap { width: 100%; display: flex; justify-content: space-between; align-items: center;
          font-size: var(--t-small); font-weight: var(--w-heavy); color: var(--ink-2);
          line-height: var(--lh-tight); }
  .mcap .ic, .mline .iw .ic { margin-right: -0.375em; }
  .mline { display: none; width: 100%; align-items: center; gap: var(--s-2);
           font-size: var(--t-small); font-weight: var(--w-heavy); color: var(--ink-2);
           line-height: var(--lh-tight); white-space: nowrap; }
  .mline .gi { width: var(--s-5); height: var(--s-5); color: var(--ink); }
  .mline .iw { margin-left: auto; }

  /* ---- POI rows (items 2, 31, 40, 46, 56) and the index rail (57) ---- */
  .colbody { flex: 1; display: flex; min-height: 0; position: relative; }
  .list { flex: 1; min-width: 0; overflow: hidden;
          mask-image: linear-gradient(var(--ink) calc(100% - var(--s-3)), transparent); }
  .row { width: 100%; height: var(--row-h); display: flex; align-items: center; gap: var(--s-2);
         padding: 0 var(--s-3); border-bottom: 1px solid var(--line); }
  .rn { width: 3ch; flex: none; text-align: right; font-size: var(--t-row);
        font-weight: var(--w-heavy); line-height: var(--lh-tight); }
  .rc { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--s-1); }
  .rb { display: block; height: var(--s-1); border-radius: var(--r-sm); background: var(--line);
        overflow: hidden; }
  .rb i, .nb i, .cb i { display: block; height: 100%; background: var(--ink-3);
                        border-radius: inherit; }
  /* items 2 and 59: a POI in progress has a --prog bar, in the column and in the grid */
  .rb i, .cell.part .cb i { background: var(--prog); }
  .rt { font-size: var(--t-small); font-weight: var(--w-medium); color: var(--ink-2);
        line-height: var(--lh-tight); white-space: nowrap; }
  .row.done { background: var(--ok-bg); }
  .row.done .rn, .row.done .rt { color: var(--ok); }
  .row.done .rb i { background: var(--ok); }
  .row.err { background: var(--err-bg); box-shadow: inset var(--s-1) 0 0 0 var(--err); }
  .row.err .rn, .row.err .rt { color: var(--err); }
  .row.err .rb i { background: var(--err); }
  .row.nd .rn, .row.nd .rt { color: var(--ink-2); }
  .row.nd .rb { opacity: var(--o-off); }
  /* item 40: the tint and the edge stay amber in every state; a done or error
     row shows its state in the colour of its number, text and bar */
  .row.active { background: var(--active); box-shadow: inset var(--s-1) 0 0 0 var(--active-line); }
  .row.active .rn { color: var(--warn); }
  .row.active .rt { color: var(--ink); font-weight: var(--w-heavy); }
  .row.active.done .rn, .row.active.done .rt { color: var(--ok); }
  .row.active.err .rn, .row.active.err .rt { color: var(--err); }
  /* rail labels sit on a linear track inset by --s-2 and half a label, so the
     first and last keep clear of the hairline and the corner; the finger pad
     spans the rail's inner width */
  .rail { position: relative; width: var(--s-6); flex: none; border-left: 1px solid var(--line);
          background: var(--panel-strong); }
  .rail span { position: absolute; left: 0; right: 0; text-align: center;
               transform: translateY(-50%); font-size: var(--t-small);
               font-weight: var(--w-heavy); color: var(--ink-2); line-height: var(--lh-tight); }
  .finger { position: absolute; left: 0; right: 0; height: var(--tap-min);
            border-radius: var(--r-md); background: var(--man-soft);
            box-shadow: inset 0 0 0 1px var(--line); transform: translateY(-50%); }
  .bubble { position: absolute; right: calc(var(--s-6) + var(--s-2)); min-width: var(--tap-min);
            height: var(--tap-min); padding: 0 var(--s-4); border-radius: var(--r-md);
            background: var(--disc); color: var(--disc-glyph); font-size: var(--t-title);
            font-weight: var(--w-heavy); display: flex; align-items: center;
            justify-content: center; box-shadow: var(--shadow-lift);
            transform: translateY(-50%); z-index: 12; }
  /* "Add routes in Settings" (item 35): the action bar's button look, its
     radius concentric with the column's */
  .colbtn { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2);
            margin: var(--s-3); width: calc(100% - 2 * var(--s-3)); min-height: var(--tap-min);
            padding: var(--s-3) var(--s-4); font-size: var(--t-body); font-weight: var(--w-bold);
            line-height: round(up, calc(var(--lh-body) * var(--t-body)), 1px);
            text-wrap: balance; color: var(--ink);
            background: var(--panel-strong); border: 1px solid var(--line);
            border-radius: calc(var(--r-md) - var(--s-3) - 1px); }
  .colbtn .ic { margin-right: -0.375em; }

  /* ---- head (items 4, 19, 43). The number's box is trimmed to its cap
     height and baseline and rounded up to a whole pixel; the counter column
     keeps --s-3 between its trimmed lines, so its cap top and last baseline
     are level with the number's. In portrait the head keeps room for the
     compass, which sits at the main area's top, one gap under the top bar:
     the head is at least as tall as the compass, so the type pill sits one
     gap under it (item 19). ---- */
  .head { display: flex; flex-wrap: nowrap; align-items: flex-start; gap: var(--s-4);
          min-height: var(--compass);
          padding-right: calc(var(--compass) + var(--s-2)); }
  /* ink shifted left by the digits' side bearing: Manrope ExtraBold sets a
     "1" 3px and a "5" 5px in at 92px, so the midpoint keeps both within 1px */
  .big { flex: none; font-size: var(--t-num); line-height: var(--lh-tight);
         font-weight: var(--w-heavy); text-box: trim-both cap alphabetic;
         height: round(up, 1cap, 1px); margin-left: -0.0435em; }
  .big.dash { color: var(--ink-3); }
  .hcol { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--s-3); }
  .plabel { font-size: var(--t-small); letter-spacing: calc(var(--s-1) / 2);
            font-weight: var(--w-bold); color: var(--ink-2); line-height: var(--lh-tight);
            text-box: trim-both cap alphabetic; }
  .cnt { font-size: var(--t-title); font-weight: var(--w-heavy); line-height: var(--lh-tight);
         text-wrap: balance; text-box: trim-both cap alphabetic; }
  .rest { font-size: var(--t-body); font-weight: var(--w-medium); color: var(--ink-2);
          line-height: var(--lh-tight); text-box: trim-both cap alphabetic; }
  .rest span { white-space: nowrap; }
  .rest.ok { color: var(--ok); font-weight: var(--w-bold); }
  /* the compass (item 19): a drawn widget on a raised round face, all in
     tokens. One arrow shows where the car drives: its left half --disc,
     the colour of the maneuver discs, its right half --side, the colour of
     the side discs. The dial stays fixed with N up. */
  .compass { position: absolute; right: anchor(--main right); top: anchor(--main top);
             width: var(--compass); height: var(--compass); border-radius: 50%;
             background: var(--panel-raised); box-shadow: var(--shadow); z-index: 2; }
  .compass .edge { fill: none; stroke: var(--line); }
  .compass .minor { fill: none; stroke: var(--ink-3); stroke-linecap: round; }
  .compass .major { fill: none; stroke: var(--ink-2); stroke-linecap: round; }
  .compass text { font-size: var(--t-small); fill: var(--ink-2); font-weight: var(--w-bold);
                  text-anchor: middle; dominant-baseline: central; }
  .compass .cn { fill: var(--ink); font-weight: var(--w-heavy); }
  .compass .halo { fill: none; stroke: var(--panel-raised); stroke-linejoin: round; }
  .compass .dark { fill: var(--disc); }
  .compass .amber { fill: var(--side); }
  /* no heading yet, or only a last known course: the arrow is pale. It is
     always on the dial: with no heading yet it shows the course this
     tablet saved last, or north (item 19) */
  .compass.idle .arrow { opacity: var(--o-off); }

  /* ---- type pill and its menu (items 46, 60, 69) ---- */
  .typewrap { anchor-name: --pill; }
  .typebtn { width: 100%; display: flex; align-items: center; gap: var(--s-3);
             min-height: var(--tap-min); padding: var(--s-2) var(--s-4);
             background: var(--panel-strong); border: 1px solid var(--panel-edge);
             border-radius: var(--r-md); box-shadow: var(--shadow); }
  /* the tile is a map of the maneuvers: three fixed slots, Left, Straight,
     Right; an absent maneuver leaves its slot empty. One size for every
     type (the pill's inner height less its two hairlines), radius concentric
     with the pill's. */
  .ticon { flex: none; display: grid; grid-template-columns: repeat(3, var(--s-5));
           gap: var(--s-1); justify-content: center; align-content: center;
           width: calc(3 * var(--s-5) + 2 * var(--s-1) + 2 * var(--s-2));
           height: calc(var(--tap-min) - 2 * (var(--s-2) + 1px));
           border-radius: calc(var(--r-md) - var(--s-2) - 1px); background: var(--disc);
           color: var(--disc-glyph); }
  .ticon svg { width: var(--s-5); height: var(--s-5); }
  .ticon .sl { grid-column: 1; }
  .ticon .ss, .ticon .sb { grid-column: 2; }
  .ticon .sr { grid-column: 3; }
  .typebtn.nd { background: transparent; border: 1px dashed var(--ink-2); box-shadow: none; }
  .typebtn.nd .ticon, .ticon.nd { background: transparent;
                                  box-shadow: inset 0 0 0 1px var(--ink-2); color: var(--ink-2); }
  .typebtn.off { opacity: var(--o-off); }
  .tl { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--s-1); }
  .tl b { font-size: var(--t-label); font-weight: var(--w-heavy); line-height: var(--lh-tight);
          white-space: nowrap; }
  .tl small, .ol small { display: flex; flex-wrap: wrap; align-items: center; column-gap: var(--s-1);
                         row-gap: var(--s-1); font-size: var(--t-small); font-weight: var(--w-bold);
                         color: var(--ink-2); line-height: var(--lh-tight); }
  .tchg { display: inline-flex; align-items: center; gap: var(--s-1); font-size: var(--t-small);
          font-weight: var(--w-heavy); color: var(--ink-2); white-space: nowrap; }
  .tchg .ic { margin-right: -0.25em; }

  /* ---- "Still needed" card (item 39). A tile is its label, its value and
     its bar (v0.32). The text lines are trimmed to cap height and baseline
     and rounded up, so the inset above the label and the inset below the
     bar are both the tile's padding. ---- */
  .card { background: var(--panel); border: 1px solid var(--panel-edge);
          border-radius: var(--r-md); box-shadow: var(--shadow); padding: var(--s-4);
          display: flex; flex-direction: column; gap: var(--s-3); }
  .sph { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-2); }
  .sph.sides { margin-top: var(--s-3); }
  .spt { font-size: var(--t-small); letter-spacing: calc(var(--s-1) / 2);
         font-weight: var(--w-heavy); color: var(--ink-2); line-height: var(--lh-tight); }
  .spn { font-size: var(--t-small); font-weight: var(--w-bold); color: var(--ink-2);
         line-height: var(--lh-tight); }
  .need { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-2); }
  .nc { display: flex; flex-direction: column; gap: var(--s-2); min-width: 0;
        padding: var(--s-3); border-radius: var(--r-sm); background: var(--panel-strong); }
  .nh { display: block; font-size: var(--t-small); font-weight: var(--w-heavy); color: var(--ink-2);
        line-height: var(--lh-tight); white-space: nowrap; text-box: trim-both cap alphabetic;
        height: round(up, 1cap, 1px); }
  /* the inline icon sits centred on the cap height: its bottom 0.15em under the baseline */
  .nh .ic { display: inline-block; vertical-align: -0.15em; margin-right: var(--s-1); }
  .nv { font-size: var(--t-title); font-weight: var(--w-heavy); line-height: var(--lh-tight);
        white-space: nowrap; text-box: trim-both cap alphabetic; height: round(up, 1cap, 1px); }
  .nv small { font-size: var(--t-small); font-weight: var(--w-bold); color: var(--ink-2);
              margin-left: var(--s-1); }
  /* "Done" is a label, not a number: smaller, on the numbers' baseline */
  .nv .dn { font-size: var(--t-label); }
  .nb { display: block; height: var(--s-1); border-radius: var(--r-sm); background: var(--line);
        overflow: hidden; }
  .nc.ok .nv { color: var(--ok); }
  .nc.ok .nb i { background: var(--ok); }
  .nc.over .nv { color: var(--warn); }
  .nc.over .nb i { background: var(--warn); }
  .nc.off .nv, .nc.off .nb { opacity: var(--o-zero); }
  .sides4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s-2); }
  /* Manrope sets the digits' cap-to-baseline box about 1.3px above the centre
     of its line box, so a quarter step of padding moves from top to bottom */
  .sv { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-2);
        min-width: 0; border-radius: var(--r-sm);
        padding: calc(var(--s-2) - var(--s-1) / 4) var(--s-3) calc(var(--s-2) + var(--s-1) / 4);
        background: var(--side-soft); }
  .svl { font-size: var(--t-label); font-weight: var(--w-heavy); color: var(--warn);
         line-height: var(--lh-tight); }
  .svv { font-size: var(--t-title); font-weight: var(--w-heavy); line-height: var(--lh-tight); }
  .sv.z .svv { opacity: var(--o-zero); }

  /* ---- discs (items 5, 6, 10, 19, 26, 46). The closed cluster sits in the
     middle of its free space. Where the zone is too short for centred discs
     plus one caption line, the cluster rises just enough for the caption to
     keep --s-4 from the action bar. The open compass is centred too and, where
     it does not fit, keeps --s-2 from the bar and rises over the card. The
     placement depends on the zone's height only, never on a caption, and is
     rounded to a whole pixel. ---- */
  .stagezone { flex: 1; min-height: 0; position: relative; }
  .stagebox { position: absolute; left: 0; right: 0; height: calc(2 * var(--disc-man));
              top: round(max(0px, min(calc((100% - 2 * var(--disc-man)) / 2),
                                      calc(100% + var(--gap) - var(--s-4) - 2 * var(--disc-man)
                                           - (var(--s-4) + round(up, calc(var(--lh-body) * var(--t-body)), 1px) + 2 * var(--s-1))))), 1px); }
  .stagebox:has(.stage.open) { height: calc(2 * var(--side-reach) + var(--disc-side));
              top: round(min(calc((100% - (2 * var(--side-reach) + var(--disc-side))) / 2),
                             calc(100% + var(--gap) - var(--s-2) - var(--s-1)
                                  - (2 * var(--side-reach) + var(--disc-side)))), 1px); }
  .stage { position: relative; margin: 0 auto; height: 100%;
           width: calc(2 * var(--side-reach) + 2 * var(--s-2) + var(--disc-man)); }
  .disc { position: absolute; left: 50%; top: 50%; width: var(--disc-man); height: var(--disc-man);
          border-radius: 50%; transform: translate(-50%, -50%); display: flex;
          align-items: center; justify-content: center; background: var(--disc);
          color: var(--disc-glyph); box-shadow: var(--shadow-lift); z-index: 3; }
  .disc svg { width: 56%; height: 56%; }
  .disc.l { left: calc(50% - var(--side-reach) - var(--s-2));
            top: calc(50% + (var(--side-reach) - var(--s-2)) / 2); }
  .disc.st { top: calc(50% - (var(--side-reach) - var(--s-2)) / 2); }
  .disc.r { left: calc(50% + var(--side-reach) + var(--s-2));
            top: calc(50% + (var(--side-reach) - var(--s-2)) / 2); }
  .stage.open .disc.on { left: 50%; top: 50%; }
  .stage.open .disc:not(.on) { visibility: hidden; }
  .disc.locked { opacity: var(--o-locked); box-shadow: var(--shadow); }
  .side { position: absolute; left: 50%; top: 50%; width: var(--disc-side); height: var(--disc-side);
          border-radius: 50%; transform: translate(-50%, -50%); display: flex;
          align-items: center; justify-content: center; font-size: var(--t-title);
          font-weight: var(--w-heavy); line-height: var(--lh-tight); background: var(--side);
          color: var(--side-glyph); box-shadow: 0 0 0 var(--s-1) var(--side-ring), var(--shadow-lift);
          z-index: 4; }
  .side-n { top: calc(50% - var(--side-reach)); }
  .side-s { top: calc(50% + var(--side-reach)); }
  .side-w { left: calc(50% - var(--side-reach)); }
  .side-e { left: calc(50% + var(--side-reach)); }
  /* the caption sits --s-4 under the lowest disc, centred, on one line, as
     wide as its text up to the zone's width plus --s-2 on each side, so a
     wider font rendering never wraps it */
  .lock { position: absolute; left: 50%; top: calc(100% + var(--s-4)); translate: -50% 0;
          width: max-content; max-width: calc(100% + 2 * var(--s-2)); text-wrap: balance;
          font-size: var(--t-body); font-weight: var(--w-bold); border-radius: var(--r-sm);
          padding: var(--s-1) var(--s-3); text-align: center;
          line-height: round(up, calc(var(--lh-body) * var(--t-body)), 1px); }
  .lock.ok { color: var(--ok); background: var(--ok-bg); }
  .lock.err { color: var(--err); background: var(--err-bg); }
  .lock.info { color: var(--ink-2); background: var(--panel-strong); }

  /* ---- action bar (items 3, 8, 9, 10, 26, 27, 42, 51): buttons concentric
     with the bar; in landscape the bar runs under the whole main area and
     holds the summary; a dimmed control carries its caption ---- */
  .bar { flex: none; display: flex; align-items: center; gap: var(--s-2); padding: var(--s-2);
         background: var(--panel); border: 1px solid var(--panel-edge);
         border-radius: var(--r-md); box-shadow: var(--shadow); }
  .btn { display: inline-flex; align-items: center; height: var(--tap-min);
         padding: 0 var(--s-4); font-size: var(--t-body); font-weight: var(--w-bold);
         background: var(--panel-strong); border: 1px solid var(--line);
         border-radius: calc(var(--r-md) - var(--s-2) - 1px); white-space: nowrap; }
  .btn.off { opacity: var(--o-off); }
  .btn.cancel { margin-left: auto; }
  .barnote { font-size: var(--t-small); font-weight: var(--w-medium); color: var(--ink-2);
             line-height: var(--lh-tight); white-space: nowrap; }

  /* ---- overlays: dimmed background, dialogs (item 63), the grid (59, 66).
     Raised surfaces in both themes; dialogs snap to whole pixels. ---- */
  .scrim { position: absolute; inset: 0; z-index: 25; background: var(--scrim); }
  .scrim.top { z-index: 50; }
  .dlg { position: absolute; z-index: 51; left: round(50%, 1px); top: round(50%, 1px);
         translate: round(-50%, 1px) round(-50%, 1px);
         width: calc(100% - 2 * var(--s-6)); max-width: calc(var(--col-narrow) + var(--col-wide));
         background: var(--panel-raised); border: 1px solid var(--panel-edge);
         border-radius: var(--r-lg); box-shadow: var(--shadow-lift); padding: var(--s-5);
         display: flex; flex-direction: column; gap: var(--s-4); }
  .dtitle { font-size: var(--t-title); font-weight: var(--w-heavy); line-height: var(--lh-tight); }
  .dchip { align-self: flex-start; display: inline-flex; align-items: center; gap: var(--s-1);
           padding: var(--s-2) var(--s-3); border-radius: var(--r-sm); background: var(--man-soft);
           font-size: var(--t-label); font-weight: var(--w-heavy); line-height: var(--lh-tight); }
  .dbody { font-size: var(--t-body); font-weight: var(--w-medium);
           line-height: round(up, calc(var(--lh-body) * var(--t-body)), 1px);
           text-wrap: balance; color: var(--ink-2); }
  .dbtns { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); margin-top: var(--s-2); }
  /* item 63: button words at the size of the action bar's buttons */
  .dbtn { height: calc(var(--tap-min) + var(--s-2)); border-radius: var(--r-sm);
          font-size: var(--t-body); font-weight: var(--w-bold); background: var(--man-soft);
          border: 1px solid var(--line); display: inline-flex; align-items: center;
          justify-content: center; }
  .dbtn.danger { background: var(--danger); border-color: var(--danger); color: var(--on-danger); }
  .dbtn.primary { background: var(--disc); border-color: var(--disc); color: var(--disc-glyph); }
  .sheet { position: absolute; inset: var(--s-4); z-index: 26; background: var(--panel-raised);
           border: 1px solid var(--panel-edge); border-radius: var(--r-lg);
           box-shadow: var(--shadow-lift); padding: var(--s-5); display: flex;
           flex-direction: column; gap: var(--s-3); }
  .shead { display: flex; align-items: center; gap: var(--s-3); }
  .stt { display: flex; align-items: baseline; gap: var(--s-3); min-width: 0; }
  .xbtn { width: var(--tap-min); height: var(--tap-min); flex: none; display: flex;
          align-items: center; justify-content: center; border-radius: 50%;
          background: var(--man-soft); border: 1px solid var(--line); color: var(--ink); }
  .xbtn svg { width: var(--s-5); height: var(--s-5); }
  .stitle { font-size: var(--t-title); font-weight: var(--w-heavy); color: var(--ink);
            line-height: var(--lh-tight); white-space: nowrap; }
  .sroute { font-size: var(--t-body); font-weight: var(--w-bold); white-space: nowrap; }
  .legend { display: flex; gap: var(--s-3); flex-wrap: wrap; font-size: var(--t-small);
            font-weight: var(--w-bold); color: var(--ink-2); }
  .lg { display: inline-flex; align-items: center; gap: var(--s-2); }
  /* six states, as the mini-map's squares (item 59). Each has a colour and a
     second sign that needs no colour, for sun glare and for eyes that mix red
     and green: a check when done, a triangle on a sheet error, a ban sign on
     stripes when not drivable, a --prog bar in progress. "Not started" keeps
     an --ink-3 edge and an empty bar, so it never reads as a hole. Each
     swatch is a small tile, and the legend's gap is --s-3, so it keeps
     to one line from 720px wide. */
  .sw { width: calc(var(--t-small) + var(--s-1)); height: calc(var(--t-small) + var(--s-1));
        border-radius: calc(var(--r-sm) / 2); display: inline-flex; align-items: center;
        justify-content: center; background: transparent; border: 1px solid var(--ink-3); }
  .sw.part, .cell.part { background: var(--prog-bg); border-color: var(--prog); }
  .sw.done, .cell.done { background: var(--ok-bg); border-color: var(--ok); }
  .sw.err, .cell.err { background: var(--err-bg); border-color: var(--err); }
  .sw.nd, .cell.nd { border-color: var(--line);
                     background: repeating-linear-gradient(135deg, var(--hatch) 0 calc(var(--s-1) / 2),
                                 transparent calc(var(--s-1) / 2) var(--s-2)); }
  .sw.act, .cell.active { background: var(--active); border-color: var(--active-line); }
  .sw.act { box-shadow: inset 0 0 0 1px var(--active-line); }
  .grid { flex: 1; min-height: 0; overflow: hidden; display: grid; align-content: start;
          grid-template-columns: repeat(10, minmax(0, 1fr)); grid-auto-rows: var(--row-h);
          gap: var(--s-2);
          mask-image: linear-gradient(var(--ink) calc(100% - var(--s-3)), transparent); }
  .cell { border-radius: var(--r-sm); background: transparent; border: 1px solid var(--ink-3);
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: var(--s-2); }
  .cn { font-size: var(--t-label); font-weight: var(--w-heavy); line-height: var(--lh-tight); }
  .cb { width: 60%; height: var(--s-1); border-radius: var(--r-sm); background: var(--line);
        overflow: hidden; display: block; }
  .cell.done .cn { color: var(--ok); }
  .cell.done .cb i { background: var(--ok); }
  .cell.err .cn { color: var(--err); }
  .cell.err .cb i { background: var(--err); }
  .cell.nd .cn { color: var(--ink-2); }
  /* the sign takes the bar's place: its negative margins give it the bar's
     height, so the numbers of a row of tiles stay on one line */
  .cell .ci { width: var(--t-label); height: var(--t-label); flex: none;
              margin-block: calc((var(--s-1) - var(--t-label)) / 2); }
  .sw .ci { width: var(--s-3); height: var(--s-3); }
  .sw.done .ci, .cell.done .ci { color: var(--ok); }
  .sw.err .ci, .cell.err .ci { color: var(--err); }
  .sw.nd .ci, .cell.nd .ci { color: var(--ink-2); }
  .cell.active { box-shadow: inset 0 0 0 var(--s-1) var(--active-line); }
  .cell.active .cn { color: var(--warn); }

  /* ---- item 51: the column is wide from 1200px; the main area follows the
     shape of the app: side by side when wider than tall, stacked when taller.
     In landscape the action bar runs under both groups and holds the summary,
     and the column runs down to the bottom. These rules come last so they win
     over the component rules above. ---- */
  @container (min-width: 1200px) {
    .body { grid-template-columns: var(--col-wide) minmax(0, 1fr); }
    /* the wide column's mini-map uses larger squares, still 20 to a row */
    .dots { grid-template-columns: repeat(20, var(--s-3)); }
    .dots i { width: var(--s-3); height: var(--s-3); }
  }
  @container (orientation: landscape) {
    .body { grid-template-rows: minmax(0, 1fr); grid-template-areas: "col main"; }
    .sumport { display: none; }
    .sumbar { display: block; }
    .main { display: grid; column-gap: var(--gap); row-gap: var(--gap);
            grid-template-columns: minmax(0, 1fr) auto;
            grid-template-rows: minmax(0, 1fr) auto;
            grid-template-areas: "left zone" "bar bar"; }
    .mleft { grid-area: left; }
    .mright { grid-area: zone; width: calc(2 * var(--side-reach) + 2 * var(--s-2) + var(--disc-man)); }
    .bar { grid-area: bar; }
    .head { padding-right: 0; min-height: 0; }
    /* the free space runs from the top of the main area to the bar */
    .stagebox { top: round(max(0px, min(calc((100% + var(--gap) - 2 * var(--disc-man)) / 2),
                                        calc(100% + var(--gap) - var(--s-4) - 2 * var(--disc-man)
                                             - (var(--s-4) + round(up, calc(var(--lh-body) * var(--t-body)), 1px) + 2 * var(--s-1))))), 1px); }
    .stagebox:has(.stage.open) {
      top: round(min(calc((100% + var(--gap) - (2 * var(--side-reach) + var(--disc-side))) / 2),
                     calc(100% + var(--gap) - var(--s-2) - var(--s-1)
                          - (2 * var(--side-reach) + var(--disc-side)))), 1px); }
  }
  /* the compact card and pill: beside the discs the left group can be
     narrow; the card and its tiles tighten, columns size to their content so
     every line keeps to one line, and the pill shows its chevron without the
     word and its split without the passes prefix */
  @container info (max-width: 400px) {
    .card { padding: var(--s-3); }
    .need { grid-template-columns: repeat(3, auto); }
    .nc { padding: var(--s-2); }
    .need, .sides4 { gap: var(--s-1); }
    .sv { padding-left: var(--s-2); padding-right: var(--s-2); gap: var(--s-1); }
    .tchg span, .tl small .tp { display: none; }
  }
  /* ---- the compact step (item 70): on a short screen display text shrinks
     and the mini-map becomes a one-line grid button; discs, the compass and
     tap targets keep their size ---- */
  @container (max-height: 700px) {
    .big { font-size: var(--t-num-compact); }
    .cnt { font-size: var(--t-label); }
    .rest { font-size: var(--t-small); }
    .nv, .svv { font-size: var(--t-label); }
    /* half a step between the counter lines keeps them level with the smaller number */
    .hcol { gap: calc(var(--s-3) / 2); }
    .mmap { flex-direction: row; align-items: center; height: var(--tap-min);
            padding: 0 var(--s-3); }
    .mm { display: none; }
    .mline { display: flex; }
  }
  /* ---- the compact landscape step (item 70, v0.32): the side margins
     become --s-4, the gaps beside the column and the discs --s-3 and the
     closed side discs sit --s-2 nearer to Straight. The disc size, the
     vertical offsets and the open compass do not change. ---- */
  @container (max-height: 700px) and (orientation: landscape) {
    .scr { padding-left: var(--s-4); padding-right: var(--s-4); }
    .body { column-gap: var(--s-3); }
    .main { column-gap: var(--s-3); }
    .mright, .stage { width: calc(2 * var(--side-reach) + var(--disc-man)); }
    .disc.l { left: calc(50% - var(--side-reach)); }
    .disc.r { left: calc(50% + var(--side-reach)); }
    /* the caption keeps one line and its spare width in the narrower zone */
    .lock { padding-left: var(--s-2); padding-right: var(--s-2); }
  }
  /* with that width the card and its tiles keep their normal paddings
     instead of the compact ones: from the landscape minimum of 1000px the
     left group is at least 370px wide, enough for every label, value and
     chip to keep its spare width. In a frame dragged narrower the compact
     card stays. The pill keeps its compact look. */
  @container (max-height: 700px) and (orientation: landscape) and (min-width: 1000px) {
    .card { padding: var(--s-4) var(--s-3); }
    /* --s-4 between the two sections over the card's --s-3 row gap */
    .sph.sides { margin-top: calc(var(--s-4) - var(--s-3)); }
    .need { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-2); }
    .nc { padding: var(--s-3); }
    .sides4 { gap: var(--s-2); }
    .sv { padding-left: var(--s-3); padding-right: var(--s-3); gap: var(--s-2); }
  }
  /* ---- the compass's sizes (item 19, v0.35): 128px, 144px on a tall
     landscape screen, 96px on a short one. The compass and the head read
     --compass, so one step sets it for both. ---- */
  @container (orientation: landscape) and (height > 700px) {
    .scr { --compass: var(--compass-wide); }
  }
  @container (max-height: 700px) {
    .scr { --compass: var(--compass-compact); }
  }
  /* ---- the roomy card (item 71, v0.33): on a tall landscape screen the
     "Still needed" card steps up one size, the mirror of the compact
     step, so it keeps its 1000 × 600 proportion beside the discs. Only
     its text sizes and paddings change. Where the left group is narrower
     than 520px the larger values would lose their spare width, so the
     normal card stays. ---- */
  @container (orientation: landscape) and (height > 700px) {
    @container info (width >= 520px) {
      .card { padding: var(--s-5); gap: var(--s-4); }
      /* --s-5 between the sections: the card's --s-4 gap plus --s-2 */
      .sph.sides { margin-top: var(--s-2); }
      .spt, .spn { font-size: var(--t-body); }
      .need, .sides4 { gap: var(--s-3); }
      .nc { padding: var(--s-4); gap: var(--s-3); }
      .nh { font-size: var(--t-body); }
      .nv { font-size: var(--t-stat); }
      .nv small { font-size: var(--t-body); margin-left: var(--s-2); }
      .nv .dn { font-size: var(--t-title); }
      .nb { height: var(--s-2); }
      /* taller chips, the same text: the sides are secondary */
      .sv { padding: calc(var(--s-3) - var(--s-1) / 4) var(--s-4)
                     calc(var(--s-3) + var(--s-1) / 4); }
    }
  }

  /* ============================================================
     HISTORY (screens.md items 12, 13, 14, 38, 41, 44, 45, 47, 48, 61,
     63, 66). The panel fills the main area of the shell above and takes
     the column's surface, so the two read as a pair. Tokens only, as
     the canon note above says.
     ============================================================ */
  .hist { flex: 1; min-height: 0; grid-area: 1 / 1 / -1 / -1; position: relative;
          display: flex; flex-direction: column; gap: var(--s-3); padding: var(--s-4);
          background: var(--panel); border: 1px solid var(--panel-edge);
          border-radius: var(--r-md); box-shadow: var(--shadow); }
  /* header: the round close button (item 66), the title, the scope control
     (item 12), a segmented control in the iOS style: a soft track with --s-1
     of inset, the chosen segment raised; radii concentric; the segments
     --s-2 apart so each is its own tap target, both as wide as the wider */
  .hh { flex: none; display: flex; align-items: center; gap: var(--s-3); }
  .ht { flex: 1; min-width: 0; margin: 0; font-size: var(--t-row); font-weight: var(--w-heavy);
        line-height: var(--lh-tight); white-space: nowrap; }
  .seg { flex: none; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: var(--s-2);
         padding: var(--s-1); background: var(--man-soft); border-radius: var(--r-md); }
  .sg { height: var(--tap-min); min-width: calc(var(--tap-min) + var(--s-6)); padding: 0 var(--s-4);
        display: inline-flex; align-items: center; justify-content: center;
        font-size: var(--t-body); font-weight: var(--w-heavy); color: var(--ink-2);
        border-radius: calc(var(--r-md) - var(--s-1)); white-space: nowrap; }
  .sg.on { background: var(--panel-raised); box-shadow: var(--shadow); color: var(--ink); }
  /* sub-header (item 41): amber chip, quiet context, neutral chip */
  .hsub { flex: none; display: flex; align-items: center; gap: var(--s-3); }
  .chip { flex: none; display: inline-flex; align-items: center; padding: var(--s-1) var(--s-2);
          border-radius: var(--r-sm); background: var(--man-soft); color: var(--ink);
          font-size: var(--t-body); font-weight: var(--w-heavy); line-height: var(--lh-tight);
          white-space: nowrap; }
  .chip.amber { background: var(--side-soft); color: var(--warn); }
  .hctx { flex: 1; min-width: 0; font-size: var(--t-small); font-weight: var(--w-bold);
          color: var(--ink-2); line-height: var(--lh-tight); white-space: nowrap; }
  /* queue line (item 13), only while removals are queued */
  .hq { flex: none; display: flex; align-items: center; gap: var(--s-2); font-size: var(--t-small);
        font-weight: var(--w-bold); color: var(--ink-2); line-height: var(--lh-tight);
        white-space: nowrap; }
  .hq .dot { background: var(--warn); }
  /* the sync control's dot follows the queue: waiting in the warning colour
     (item 33), a refused pass in the error colour (item 47) */
  .sync.wait .dot { background: var(--warn); }
  .sync.bad .dot { background: var(--err); }
  /* the list: a grid whose columns are shared by every row, so the POI
     number and the time each sit in one fixed slot as wide as the widest. A
     row element has no box of its own (display: contents): its lines are
     items of the list's grid and the subgrid reaches every one of them. The
     first line is --row-h tall with a hairline, as the POI rows beside it;
     its content is --tap-min tall, --s-1 under the row's top, so the "Delete"
     button and the texts land on whole pixels. The texts share a baseline
     inside their own block; each is trimmed to its cap height and baseline,
     so the block's centre is the ink's centre. A whole row sits at the top
     edge, the cut row at the bottom fades (item 56). */
  .hlist { flex: 1; min-height: 0; overflow: hidden; overflow-anchor: none; display: grid; align-content: start;
           column-gap: var(--s-2);
           grid-template-columns: [time] max-content [side] minmax(0, 1fr) [label] max-content [act] max-content;
           mask-image: linear-gradient(var(--ink) calc(100% - var(--s-3)), transparent); }
  .hlist[data-scope="route"] { grid-template-columns: [num] max-content [time] max-content [side] minmax(0, 1fr) [label] max-content [act] max-content; }
  .hlist.end { mask-image: none; padding-bottom: var(--row-h); }
  .hr { display: contents; }
  .hl1 { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center;
         height: var(--row-h); padding-top: var(--s-1);
         padding-bottom: calc(var(--row-h) - var(--tap-min) - var(--s-1) - 1px);
         border-bottom: 1px solid var(--line); }
  .htx { grid-column: 1 / -2; display: grid; grid-template-columns: subgrid; align-items: baseline; }
  .hn, .htm, .hmv, .hst { text-box: trim-both cap alphabetic; }
  .hn { font-size: var(--t-row); font-weight: var(--w-heavy); line-height: var(--lh-tight);
        text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .htm { font-size: var(--t-body); font-weight: var(--w-medium); color: var(--ink-2);
         line-height: var(--lh-tight); text-align: right; font-variant-numeric: tabular-nums;
         white-space: nowrap; }
  .hmv { min-width: 0; font-size: var(--t-label); font-weight: var(--w-heavy); line-height: var(--lh-tight);
         white-space: nowrap; }
  /* the inline icon sits centred on the cap height, as in the card's tiles */
  .hmv .ic { display: inline-block; vertical-align: -0.15em; margin-right: var(--s-1); }
  .hst { font-size: var(--t-small); font-weight: var(--w-heavy); color: var(--ink-2);
         line-height: var(--lh-tight); white-space: nowrap; }
  .hst.wait { color: var(--ink); }
  .hst .dot { display: inline-block; vertical-align: calc(0.5cap - var(--s-1)); margin-right: var(--s-1);
              background: var(--warn); }
  .hst.rej { color: var(--err); }
  /* "Delete" (items 13, 28): red text on the red tint, at the right edge, a
     tap target; the filled red button stays reserved for the dialog. Its box
     is --tap-min + --s-5 wide: --s-3 of padding less the hairline keeps the
     word inside that width, so the box lands on whole pixels. */
  .hdel { align-self: center; justify-self: end; display: inline-flex; align-items: center;
          justify-content: center; height: var(--tap-min); min-width: calc(var(--tap-min) + var(--s-5));
          padding: 0 calc(var(--s-3) - 1px); font-size: var(--t-body); font-weight: var(--w-bold);
          color: var(--err); background: var(--err-bg); border: 1px solid var(--line);
          border-radius: var(--r-sm); white-space: nowrap; }
  /* a deleted pass (items 13, 38): struck through, labelled, no buttons, not dimmed */
  .hr.del .htm, .hr.del .hmv { text-decoration: line-through; }
  /* a refused pass (item 47): three lines with --s-3 above and below, the
     reason as a sentence, its two actions at the right edge, never on the
     line with the time; the hairline closes the row under the actions */
  .hr.rej .hl1 { height: var(--tap-min); padding: 0; border: 0; margin-top: var(--s-3); }
  .hwhy { grid-column: 1 / -1; margin: var(--s-2) 0 0; font-size: var(--t-small); font-weight: var(--w-medium);
          color: var(--ink-2); line-height: round(up, calc(var(--lh-body) * var(--t-small)), 1px);
          text-wrap: balance; }
  .hacts { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: var(--s-2);
           margin-top: var(--s-2); padding-bottom: var(--s-3); border-bottom: 1px solid var(--line); }
  .hacts .btn { min-width: calc(3 * var(--tap-min) - var(--s-6)); justify-content: center; }
  /* the end of the list (item 48) and the empty state (items 14, 45) */
  .hend { grid-column: 1 / -1; margin: 0; padding: var(--s-4) var(--s-3); text-align: center;
          font-size: var(--t-small); font-weight: var(--w-medium); color: var(--ink-2);
          line-height: round(up, calc(var(--lh-body) * var(--t-small)), 1px); }
  .hend span { display: block; white-space: nowrap; }
  .hlist.empty { display: flex; align-items: center; justify-content: center; mask-image: none; }
  .hempty { display: flex; flex-direction: column; gap: var(--s-2); text-align: center;
            max-width: 40ch; }
  .hempty b { font-size: var(--t-label); font-weight: var(--w-heavy); line-height: var(--lh-tight);
              white-space: nowrap; }
  .hempty p { margin: 0; font-size: var(--t-small); font-weight: var(--w-medium); color: var(--ink-2);
              line-height: round(up, calc(var(--lh-body) * var(--t-small)), 1px); text-wrap: balance; }
  /* footer (items 14, 45) */
  .hfoot { flex: none; margin: 0; padding-top: var(--s-1); text-align: center; font-size: var(--t-small);
           font-weight: var(--w-medium); color: var(--ink-2); line-height: var(--lh-tight);
           white-space: nowrap; }

  /* ============================================================
     PROTOTYPE ONLY: motion, the toast, the tools menu and the states
     the static references draw as separate frames. Tokens only.
     ============================================================ */
  .main.histopen > :not(.hist) { display: none !important; }
  .list, .grid, .hlist { overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain; }
  .list::-webkit-scrollbar, .grid::-webkit-scrollbar, .hlist::-webkit-scrollbar { display: none; }
  .rail { touch-action: none; }
  .stage:not(.open) .side { display: none; }
  .disc { transition: left var(--dur-move) var(--ease-out), top var(--dur-move) var(--ease-out),
                      opacity var(--dur-fade) var(--ease-out); }
  .disc:active:not(.locked) { scale: 0.96; }
  .side { animation: bloom var(--dur-move) var(--ease-out) both; }
  .side.bounce { animation: bounce var(--dur-bounce) var(--ease-spring) both; }
  @keyframes bloom { from { opacity: 0; scale: 0.6; } to { opacity: 1; scale: 1; } }
  @keyframes bounce { 0% { scale: 1; } 40% { scale: 1.18; } 100% { scale: 1; } }
  .cnt { transform-origin: left center; }
  .cnt.bump { animation: bump var(--dur-bounce) var(--ease-spring); }
  @keyframes bump { 0% { scale: 1; } 40% { scale: 1.12; } 100% { scale: 1; } }
  .row, .cell, .opt, .ritem, .btn, .hdel, .sg { transition: background-color var(--dur-fade) var(--ease-out); }
  /* the toast of item 36: over the working area, just above the bar */
  .toast { position: absolute; position-anchor: --main; left: anchor(center);

  }

  function renderTop() {

    var refused = state.passes.filter(function (x) { return x.status === 'rejected'; }).length;
    var b = $('syncBtn'), text, cls = '';

  var colBuilt = null;

      '</span><span class="mcap"><span>' + tot.poisDone + ' of ' + tot.drivable + ' done</span><span class="iw">Open' + icon('i-chev-right') + '</span></span></span>' +
      '<span class="mline"><svg class="gi"><use href="#i-grid"/></svg><span>' + tot.poisDone + ' of ' + tot.drivable + '</span><span class="iw">Open' + icon('i-chev-right') + '</span></span></button>' +
      '<div class="colbody"><div class="list">' + rows + '</div><div class="rail" aria-label="Jump through the POI list">' + rail + '</div>' + bubble + '</div>';

  function railTop(n) {

    list.scrollTop = Math.max(0, Math.floor(top / rh) * rh);
  }

  function renderHead() {
    var p = poi(), k = counts(p), T = TYPES[p.type], st = statusOf(p, k);

  function ticon(type) {
    if (type === 'nd') return '<span class="ticon nd"><svg class="sb"><use href="#i-ban"/></svg></span>';
    var sp = TYPES[type].split, h = '<span class="ticon">';

  function splitLine(type, withPasses) {

  function renderBar() {

        '<div class="legend"><span class="lg"><span class="sw act"></span>Current</span><span class="lg"><span class="sw done">' + icon('i-check', 'ci') + '</span>Done</span>' +
        '<span class="lg"><span class="sw part"></span>In progress</span><span class="lg"><span class="sw"></span>Not started</span>' +
        '<span class="lg"><span class="sw err">' + icon('i-alert', 'ci') + '</span>Sheet error</span><span class="lg"><span class="sw nd">' + icon('i-ban', 'ci') + '</span>Not drivable</span></div>' +

  // ---- History (items 12, 13, 14, 38, 41, 44, 45, 47, 48) ----
  function renderHistory() {
    var main = $('main');

    var p = poi(), all = state.scope === 'poi' ? passesOf(state.route, p.n) : passesOf(state.route);

    var removals = passesOf(state.route).filter(function (x) { return x.status === 'deleted'; }).length;
    var rows = all.map(function (x) {
      var num = state.scope === 'route' ? '<span class="hn">' + x.poi + '</span>' : '';
      var mv = '<span class="hmv">' + icon(MAN_ICON[x.man]) + SIDE_NAME[x.side] + '</span>';

      if (x.status === 'deleted') {

      }

  // ---- the sync panel: status, Send now, Load from sheet, Connection ----
  function syncHtml() {
    var adds = state.passes.filter(function (x) { return x.status === 'waiting'; }).length;
    var rems = state.passes.filter(function (x) { return x.status === 'deleted'; }).length;
    var waiting = adds + rems;
    var refused = state.passes.filter(function (x) { return x.status === 'rejected'; }).length;
    var what = adds && rems ? plural(waiting, 'change', 'changes') : adds ? plural(adds, 'pass', 'passes') : plural(rems, 'removal', 'removals');
    var cls = '', title, line;
    if (!state.conn) { cls = 'off'; title = 'Connection not set up'; line = 'Passes are kept on this tablet until it is set up.'; }
    else if (refused) { cls = 'bad'; title = plural(refused, 'pass', 'passes') + ' not accepted'; line = 'The sheet refused ' + (refused === 1 ? 'it' : 'them') + '. Fix the cause in the sheet, then send ' + (refused === 1 ? 'it' : 'them') + ' again from History.'; }
    else if (waiting && !netOn()) { cls = 'wait'; title = what + ' waiting for network'; line = 'Kept on this tablet. They go out on their own when the network is back.'; }
    else if (waiting) { cls = 'wait'; title = 'Sending ' + what; line = 'Last sent ' + stamp(state.lastSync); }
    else if (!netOn()) { cls = 'off'; title = 'No connection'; line = 'Nothing is waiting. Last sent ' + stamp(state.lastSync) + '.'; }
    else { title = 'All sent'; line = 'Last sent ' + stamp(state.lastSync); }
    var noNet = !netOn(), noConn = !state.conn;
    function row(act, label, small, off, go) {
      return '<button class="opt' + (off ? ' off' : '') + '" type="button" data-act="' + act + '"' + (off ? ' aria-disabled="true"' : '') + '>' +
        '<span class="ol"><b>' + label + '</b><small>' + esc(small) + '</small></span>' + (go ? icon('i-chev-right', 'go') : '') + '</button>';
    }
    var sendWhy = noConn ? 'Connection not set up' : noNet ? 'No network' : !waiting ? 'Nothing to send' : plural(waiting, 'change', 'changes') + ' go out now';
    var loadWhy = noConn ? 'Connection not set up' : noNet ? 'No network' : state.route + ' · last loaded ' + stamp(state.lastLoad);
    return '<div class="pop syncpop" role="dialog" aria-label="Sync">' +
      '<div class="pt">SYNC · ' + esc($('city').textContent.toUpperCase()) + '</div>' +
      '<div class="sstat' + (cls ? ' ' + cls : '') + '"><span class="dot"></span><span class="ol"><b>' + esc(title) + '</b><small>' + esc(line) + '</small></span></div>' +
      (refused && state.conn ? row('showhist', 'Show in History', plural(refused, 'pass', 'passes') + ' to fix or delete', false, true) : '') +
      '<div class="sdiv"></div>' +
      row('sendnow', 'Send now', sendWhy, noConn || noNet || !waiting, false) +
      row('loadsheet', 'Load from sheet', loadWhy, noConn || noNet, false) +
      '<div class="sdiv"></div>' +
      row('conn', noConn ? 'Set up connection' : 'Connection', 'Script URL and access key for ' + $('city').textContent, false, true) +
      '</div>';
  }

  // ---- the tools menu: checking tool of the prototype ----
  function toolsHtml() {
    var c = compass.status();
    var items = [
      ['theme', 'Theme', state.theme === 'dark' ? 'Dark' : 'Light'],
      ['sound', 'Sound', state.sound ? 'On' : 'Off'],
      ['network', 'Network', !state.online ? 'Offline (test)' : navigator.onLine === false ? 'No network on the tablet' : 'Online'],
      ['refuse', 'Next send', state.refuseNext ? 'Refused (test)' : 'Accepted'],
      ['conn', 'Connection', state.conn ? 'Set up' : 'Not set up'],
      ['gps', 'GPS', compass.gpsOn() ? 'On' : 'Off'],
      ['savelog', 'Save sensor logs', compass.rows() + ' rows · ' + compass.drives() + (compass.drives() === 1 ? ' drive' : ' drives')],
      ['full', 'Full screen', document.fullscreenElement ? 'On' : 'Off'],
      ['reset', 'Reset sample data', 'Back to the start']
    ];
    return '<div class="rmenu toolsmenu" role="menu" aria-label="Prototype tools">' +

      return total() + ' rows in this drive, kept on the tablet' + (keep.savedAt ? ' ' + secs(t - keep.savedAt) + ' ago' : '') +
        ' · ' + drivesKept() + ' of ' + LOG_KEEP + ' drives kept';
    }
    function two(n) { return (n < 10 ? '0' : '') + n; }
    function iso(ms) { return new Date(ms).toISOString(); }
    // one file with every kept drive, newest first, each with its own header
    function saveLog() {
      flush();
      var parts = [], drives = 0, rows = 0, list = [];
      try { list = keep.ok ? readIndex() : []; } catch (e) { list = []; }
      var mine = keep.ok && keep.entry;
      function section(head, body, n) { parts.push(head + '\n' + COLS.join(',') + (body ? '\n' + body : '')); drives += 1; rows += n; }
      if (!mine) {
        section('# POI Tracker prototype ' + VERSION + ' sensor log · this drive, not kept on the tablet · started ' + iso(Date.now() - (now() - t0)) +
          ' · ' + navigator.userAgent, log.map(function (x) { return x.join(','); }).join('\n'), log.length);
      }
      for (var i = list.length - 1; i >= 0; i--) {
        var e = list[i], pieces = [];
        for (var k = 0; k < e.chunks; k++) { var v = localStorage.getItem(STORE + ':' + e.id + ':' + k); if (v) pieces.push(v); }
        section('# POI Tracker prototype ' + (e.ver || VERSION) + ' sensor log · ' + (mine && e.id === keep.entry.id ? 'this drive' : 'an earlier drive') +
          ' · started ' + iso(e.started) + ' · last row ' + iso(e.last) + ' · ' + e.rows + ' rows · ' + navigator.userAgent, pieces.join('\n'), e.rows);
      }
      var text = parts.join('\n') + '\n';
      var a = document.createElement('a'), d = new Date();
      a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' }));
      a.download = 'prototype-' + VERSION + '-sensors-' + d.getFullYear() + two(d.getMonth() + 1) + two(d.getDate()) + '-' + two(d.getHours()) + two(d.getMinutes()) + '.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
      return { drives: drives, rows: rows };
    }
    setInterval(function () { if (state.menu === 'tools') render(); }, 1000);
    return { permit: permit, tap: tap, draw: draw, toggleGps: toggleGps, status: status, saveLog: saveLog,
             gpsOn: function () { return watch !== null; }, rows: total, drives: drivesKept };
  }());

  render();
  compass.draw();
  requestAnimationFrame(function () { centreList(route().active); });
}());

</script>
