<!DOCTYPE html>
<!--
  ================================================================
  POI Tracker — compass prototype
  File: tools/compass-prototype.html

  A test page for the car (screens.md item 19, data-model.md "Heading"):
  the tablet's sensors turn the compass of main-screen.html v0.24. Open it
  on the tablet over https (GitHub Pages), tap Start and watch the needle
  while driving. Nothing here is part of the app; the page stores one
  value on the tablet, the mount's offset, under "poi-compass-offset".

  v1.0 2026-10-11 — first version: magnet now, GPS course while moving,
          a one-time offset for the angle of the mount, smoothing over
          1.2 seconds, and the open question as a switch: does the
          needle turn, or the dial.
  ================================================================
-->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POI Tracker — compass prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="../docs/references/_tokens.css">
<style>
  /* Tokens only (screens.md item 68, CLAUDE.md rule 9): every colour, size,
     spacing, radius and shadow is a var() from _tokens.css v0.11. The 700px
     height of the compact step and the 1px hairlines are the same literals
     main-screen.html allows. */
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); background-image: var(--bg-grad); color: var(--ink);
         font-family: var(--font); font-size: var(--t-body); font-weight: var(--w-medium);
         line-height: var(--lh-body); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0;
           cursor: pointer; text-align: left; }
  .scr { min-height: 100vh; display: flex; flex-direction: column; gap: var(--gap);
         padding: var(--s-4) var(--s-4) calc(var(--s-4) + env(safe-area-inset-bottom, 0px)); }
  /* the compass's sizes follow the app's steps (item 19): 144px on a landscape
     viewport more than 700px tall, 96px on a viewport 700px tall or less,
     otherwise the token's 128px; "Size" fixes one of the three instead */
  @media (orientation: landscape) and (height > 700px) {
    .scr[data-size="auto"] { --compass: var(--compass-wide); }
  }
  @media (max-height: 700px) {
    .scr[data-size="auto"] { --compass: var(--compass-compact); }
  }
  .scr[data-size="96"] { --compass: var(--compass-compact); }
  .scr[data-size="144"] { --compass: var(--compass-wide); }
  .notice { padding: var(--s-3) var(--s-4); border-radius: var(--r-sm); background: var(--err-bg);
            color: var(--err); font-weight: var(--w-bold); }
  .notice[hidden] { display: none; }
  /* top bar: the title and a status pill in the style of the sync control */
  .topbar { display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap; }
  .title { flex: 1; margin: 0; font-size: var(--t-title); font-weight: var(--w-heavy);
           line-height: var(--lh-tight); white-space: nowrap; }
  .pill { display: inline-flex; align-items: center; gap: var(--s-2); height: var(--tap-min);
          padding: 0 var(--s-4); background: var(--panel-strong); border: 1px solid var(--panel-edge);
          border-radius: var(--r-md); box-shadow: var(--shadow); white-space: nowrap;
          font-size: var(--t-body); font-weight: var(--w-medium); }
  .dot { width: var(--s-2); height: var(--s-2); border-radius: 50%; background: var(--ink-3); flex: none; }
  .pill[data-state="ok"] .dot { background: var(--ok); }
  .pill[data-state="warn"] .dot { background: var(--warn); }
  .pill[data-state="err"] .dot { background: var(--err); }
  /* head, as on the working screen: the heading as the big number, the
     quarter beside it, the compass at the right */
  .head { position: relative; display: flex; align-items: flex-start; gap: var(--s-4);
          min-height: var(--compass); padding-right: calc(var(--compass) + var(--s-2)); }
  .big { flex: none; font-size: var(--t-num-compact); line-height: var(--lh-tight);
         font-weight: var(--w-heavy); font-variant-numeric: tabular-nums;
         text-box: trim-both cap alphabetic; height: round(up, 1cap, 1px); }
  .big.dash { color: var(--ink-3); }
  .hcol { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--s-3); }
  .plabel { font-size: var(--t-small); letter-spacing: calc(var(--s-1) / 2); font-weight: var(--w-bold);
            color: var(--ink-2); line-height: var(--lh-tight); text-box: trim-both cap alphabetic; }
  .quarter { font-size: var(--t-title); font-weight: var(--w-heavy); line-height: var(--lh-tight);
             text-box: trim-both cap alphabetic; }
  .from { font-size: var(--t-body); font-weight: var(--w-medium); color: var(--ink-2);
          line-height: var(--lh-tight); text-box: trim-both cap alphabetic; white-space: nowrap; }
  /* the compass: the page's own position, main-screen's colour rules */
  .compass { position: absolute; right: 0; top: 0; width: var(--compass); height: var(--compass);
             color: var(--ink); }
  .compass .marks, .compass .ring { fill: none; stroke: var(--ink-2); }
  .compass .minor { fill: none; stroke: var(--ink-3); stroke-linecap: round; }
  .compass text { font-size: var(--t-small); fill: var(--ink-2); font-weight: var(--w-bold); }
  .compass .cn { fill: var(--compass-n); font-weight: var(--w-heavy); }
  .compass .nn { fill: var(--compass-n); }
  .compass .ns { fill: var(--compass-s); }
  .compass .hub { fill: currentColor; }
  /* buttons in the action bar's style (items 26, 27, 31); a dimmed button
     carries a caption naming why */
  .btns { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2); }
  .bw { display: inline-flex; align-items: center; gap: var(--s-2); }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-width: var(--tap-min);
         height: var(--tap-min); padding: 0 var(--s-4); font-size: var(--t-body); font-weight: var(--w-bold);
         background: var(--panel-strong); border: 1px solid var(--line);
         border-radius: calc(var(--r-md) - var(--s-2) - 1px); white-space: nowrap; }
  .btn:disabled { opacity: var(--o-off); cursor: default; }
  .why { font-size: var(--t-small); font-weight: var(--w-medium); color: var(--ink-2);
         line-height: var(--lh-tight); white-space: nowrap; }
  .why[hidden] { display: none; }
  /* cards in main-screen's style */
  .card { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: var(--r-md);
          box-shadow: var(--shadow); padding: var(--s-4); display: flex; flex-direction: column;
          gap: var(--s-3); }
  .ct { font-size: var(--t-small); letter-spacing: calc(var(--s-1) / 2); font-weight: var(--w-heavy);
        color: var(--ink-2); line-height: var(--lh-tight); }
  .rd { display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: var(--s-4);
        row-gap: var(--s-2); align-items: baseline; }
  .rl { font-size: var(--t-small); font-weight: var(--w-bold); color: var(--ink-2); white-space: nowrap; }
  .rv { font-size: var(--t-label); font-weight: var(--w-heavy); line-height: var(--lh-tight);
        font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
  .log { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--s-1);
         font-size: var(--t-small); font-weight: var(--w-medium); color: var(--ink-2);
         font-variant-numeric: tabular-nums; line-height: var(--lh-body); }
</style>
</head>
<body>
<div class="scr" data-size="auto" data-dial="needle">
  <div class="notice" id="insecure" hidden>Sensors are blocked on http. Open this page over https (its GitHub Pages address).</div>
  <header class="topbar">
    <h1 class="title">Compass prototype</h1>
    <div class="pill" id="pill" data-state="off"><span class="dot"></span><span id="pilltext">Sensors off</span></div>
  </header>
  <section class="head" aria-label="Heading">
    <div class="big dash" id="big">—</div>
    <div class="hcol"><div class="plabel">HEADING</div><div class="quarter" id="quarter">—</div><div class="from" id="from">Coming from —</div></div>
    <svg class="compass" viewBox="0 0 96 96" role="img" aria-label="Heading"><g class="marks" stroke-width="2"><path d="M48 0v8M48 88v8M0 48h8M88 48h8"/></g><g class="card"><circle class="ring" cx="48" cy="48" r="40" stroke-width="2"/><path class="minor" stroke-width="1.5" d="M68 13.36L65.5 17.69M82.64 28L78.31 30.5M82.64 68L78.31 65.5M68 82.64L65.5 78.31M28 82.64L30.5 78.31M13.36 68L17.69 65.5M13.36 28L17.69 30.5M28 13.36L30.5 17.69"/><text class="cn" x="48" y="25" text-anchor="middle">N</text><text class="cl" x="76" y="53" text-anchor="middle">E</text><text class="cl" x="48" y="81" text-anchor="middle">S</text><text class="cl" x="20" y="53" text-anchor="middle">W</text></g><g class="needle" transform="rotate(0 48 48)"><path class="nn" d="M48 28 54 48 42 48Z"/><path class="ns" d="M48 68 54 48 42 48Z"/></g><circle class="hub" cx="48" cy="48" r="3.5"/></svg>
  </section>
  <div class="btns">
    <button class="btn" id="start" type="button">Start</button>
    <button class="btn" id="gps" type="button">GPS</button>
    <span class="bw"><button class="btn" id="cal" type="button" disabled>Calibrate</button><span class="why" id="calwhy">Drive straight above 10 km/h</span></span>
    <span class="bw"><button class="btn" id="clear" type="button" disabled>Clear offset</button><span class="why" id="clearwhy">No offset</span></span>
    <button class="btn" id="dial" type="button">Dial: needle</button>
    <button class="btn" id="size" type="button">Size: auto</button>
    <button class="btn" id="theme" type="button">Theme</button>
  </div>
  <section class="card" aria-label="Readings">
    <div class="ct">READINGS</div>
    <div class="rd">
      <span class="rl">Source</span><span class="rv" id="rsrc">none</span>
      <span class="rl">Magnet raw</span><span class="rv" id="rraw">—</span>
      <span class="rl">Magnet smoothed</span><span class="rv" id="rsmooth">—</span>
      <span class="rl">Level</span><span class="rv" id="rlevel">—</span>
      <span class="rl">Events per second</span><span class="rv" id="reps">0</span>
      <span class="rl">Offset</span><span class="rv" id="roff">none</span>
      <span class="rl">GPS</span><span class="rv" id="rgps">off</span>
      <span class="rl">Side</span><span class="rv" id="rside">—</span>
    </div>
  </section>
  <section class="card" aria-label="Log">
    <div class="ct">LOG</div>
    <ul class="log" id="log"></ul>
  </section>
</div>
<script>
(function () {
  'use strict';
  // ---- the compass maths. Angles in degrees; a heading runs clockwise
  // from north, 0 up to 360. Decided 2026-10-11 (data-model.md, Heading). ----
  var Heading = (function () {
    var RAD = Math.PI / 180;
    function norm(deg) { deg = deg % 360; return deg < 0 ? deg + 360 : deg; }
    // The heading of the axis that points into the screen, from the three
    // angles of a deviceorientation event (alpha, beta, gamma: Z-X'-Y''
    // intrinsic, as the W3C specification defines them). For a tablet that
    // stands in a car mount that axis points through the windscreen,
    // whatever the screen's orientation, since the screen turns around it.
    // Returns null while the tablet lies nearly flat, where that axis has
    // no horizontal direction to speak of.
    function fromOrientation(alpha, beta, gamma) {
      if (alpha == null || beta == null || gamma == null) return null;
      var cA = Math.cos(alpha * RAD), sA = Math.sin(alpha * RAD);
      var sB = Math.sin(beta * RAD);
      var cG = Math.cos(gamma * RAD), sG = Math.sin(gamma * RAD);
      var east = -(cA * sG + sA * sB * cG);
      var north = -(sA * sG - cA * sB * cG);
      var level = Math.sqrt(east * east + north * north); // 1 upright, 0 flat
      if (level < 0.3) return null;
      return norm(Math.atan2(east, north) / RAD);
    }
    // Exponential smoothing on the unit vector, so that 359 and 1 average
    // to 0 and not to 180. tau is the time constant in seconds.
    function Smoother(tau) { this.tau = tau; this.reset(); }
    Smoother.prototype.reset = function () { this.x = 0; this.y = 0; this.t = -1; };
    Smoother.prototype.push = function (deg, nowMs) {
      var k = this.t < 0 ? 1 : 1 - Math.exp(-(nowMs - this.t) / 1000 / this.tau);
      this.t = nowMs;
      this.x += k * (Math.sin(deg * RAD) - this.x);
      this.y += k * (Math.cos(deg * RAD) - this.y);
      return this.value();
    };
    Smoother.prototype.value = function () {
      if (Math.abs(this.x) < 1e-9 && Math.abs(this.y) < 1e-9) return null;
      return norm(Math.atan2(this.x, this.y) / RAD);
    };
    // The turn from heading a to heading b, in (-180, 180].
    function delta(a, b) { var d = norm(b - a); return d > 180 ? d - 360 : d; }
    // The quarter a heading falls in: N, E, S or W, each 90 degrees wide
    // and centred on its letter.
    function cardinal(deg) { return 'NESW'[Math.round(norm(deg) / 90) % 4]; }
    // The side the car approaches from: the quarter behind it.
    function approachSide(deg) { return cardinal(deg + 180); }
    return { norm: norm, fromOrientation: fromOrientation, Smoother: Smoother,
             delta: delta, cardinal: cardinal, approachSide: approachSide };
  }());
  window.Heading = Heading;

  // how upright the tablet stands: the same vector as fromOrientation's,
  // 1 upright, 0 flat (fromOrientation gives up below 0.3)
  function levelOf(alpha, beta, gamma) {
    if (alpha == null || beta == null || gamma == null) return null;
    var RAD = Math.PI / 180;
    var cA = Math.cos(alpha * RAD), sA = Math.sin(alpha * RAD);
    var sB = Math.sin(beta * RAD);
    var cG = Math.cos(gamma * RAD), sG = Math.sin(gamma * RAD);
    var east = -(cA * sG + sA * sB * cG);
    var north = -(sA * sG - cA * sB * cG);
    return Math.sqrt(east * east + north * north);
  }

  var $ = function (id) { return document.getElementById(id); };
  var scr = document.querySelector('.scr');
  var ui = { pill: $('pill'), pilltext: $('pilltext'), big: $('big'), quarter: $('quarter'), from: $('from'),
             needle: document.querySelector('.compass .needle'), card: document.querySelector('.compass .card'),
             start: $('start'), gps: $('gps'), cal: $('cal'), calwhy: $('calwhy'), clear: $('clear'), clearwhy: $('clearwhy'),
             dial: $('dial'), size: $('size'), theme: $('theme'),
             rsrc: $('rsrc'), rraw: $('rraw'), rsmooth: $('rsmooth'), rlevel: $('rlevel'), reps: $('reps'),
             roff: $('roff'), rgps: $('rgps'), rside: $('rside'), log: $('log') };
  var KEY = 'poi-compass-offset';
  var TAU = 1.2;         // seconds of smoothing (data-model.md: 1 to 2 s)
  var GPS_MIN_SPEED = 3; // m/s: below it the GPS course is noise
  var GPS_MAX_AGE = 3000; // ms: an older fix no longer steers
  var SIZES = ['auto', '96', '128', '144'];

  var state = {
    started: false, listening: null, gotEvent: false, flat: false, noSensor: false,
    rawMag: null, level: null,
    magSmooth: new Heading.Smoother(TAU), // the magnet alone, never offset: calibration compares it with GPS
    main: new Heading.Smoother(TAU),      // what the compass shows
    offset: null, offsetAt: null,
    gps: null, gpsWatch: null,
    events: 0, epsCount: 0, eps: 0,
    dial: 'needle', size: 0, raf: 0, nullSeen: false
  };

  // ---- formatting, in one place ----
  var fmt = {
    deg: function (d) { return d == null ? '—' : Math.round(d) + '°'; },
    deg1: function (d) { return d == null ? '—' : d.toFixed(1) + '°'; },
    signed: function (d) { return (d < 0 ? '-' : '+') + Math.abs(Math.round(d)) + '°'; },
    kmh: function (ms) { return ms == null ? '—' : Math.round(ms * 3.6) + ' km/h'; },
    m: function (x) { return x == null ? '—' : '±' + Math.round(x) + ' m'; },
    ago: function (t) { return Math.max(0, Math.round((Date.now() - t) / 1000)) + ' s ago'; },
    time: function (t) { var d = new Date(t); var p = function (n) { return (n < 10 ? '0' : '') + n; }; return p(d.getHours()) + ':' + p(d.getMinutes()); },
    clock: function (t) { var d = new Date(t); var p = function (n) { return (n < 10 ? '0' : '') + n; }; return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); },
    num: function (x) { return x == null ? '—' : x.toFixed(2); }
  };

  function log(text) {
    var li = document.createElement('li');
    li.textContent = fmt.clock(Date.now()) + ' · ' + text;
    ui.log.insertBefore(li, ui.log.firstChild);
    while (ui.log.children.length > 12) ui.log.removeChild(ui.log.lastChild);
  }

  if (!window.isSecureContext) { $('insecure').hidden = false; log('Not a secure context: the sensor APIs are unavailable on http.'); }

  // ---- the stored offset ----
  function loadOffset() {
    try { var v = JSON.parse(localStorage.getItem(KEY)); if (v && typeof v.offset === 'number') { state.offset = v.offset; state.offsetAt = v.at; } }
    catch (e) { state.offset = null; }
  }
  function saveOffset(offset) {
    state.offset = offset; state.offsetAt = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify({ offset: offset, at: state.offsetAt })); } catch (e) { log('Could not store the offset: ' + e.message); }
    state.main.reset(); // a new frame of reference: the shown heading starts afresh
  }
  function clearOffset() {
    state.offset = null; state.offsetAt = null;
    try { localStorage.removeItem(KEY); } catch (e) { }
    state.main.reset();
    log('Offset cleared');
  }
  loadOffset();

  // ---- the source: GPS while moving, the magnet otherwise ----
  function gpsFresh() { var g = state.gps; return !!(g && !g.error && typeof g.heading === 'number' && g.speed != null && g.speed >= GPS_MIN_SPEED && (Date.now() - g.time) < GPS_MAX_AGE); }
  function source() { if (gpsFresh()) return 'gps'; return state.gotEvent && !state.noSensor ? 'magnet' : 'none'; }

  // ---- drawing, at most once per frame ----
  function schedule() { if (!state.raf) state.raf = requestAnimationFrame(draw); }
  function draw() {
    state.raf = 0;
    var h = state.main.value();
    var src = source();
    if (h == null) {
      ui.big.textContent = '—'; ui.big.classList.add('dash');
      ui.quarter.textContent = '—'; ui.from.textContent = 'Coming from —';
      ui.rside.textContent = '—';
    } else {
      ui.big.textContent = fmt.deg(h); ui.big.classList.remove('dash');
      ui.quarter.textContent = Heading.cardinal(h);
      ui.from.textContent = 'Coming from ' + Heading.approachSide(h);
      ui.rside.textContent = 'Coming from ' + Heading.approachSide(h) + ': the quarter behind the car';
    }
    var a = h == null ? 0 : Math.round(h * 100) / 100;
    if (state.dial === 'needle') {
      ui.needle.setAttribute('transform', 'rotate(' + a + ' 48 48)');
      ui.card.setAttribute('transform', 'rotate(0 48 48)');
    } else {
      ui.needle.setAttribute('transform', 'rotate(0 48 48)');
      ui.card.setAttribute('transform', 'rotate(' + Heading.norm(-a) + ' 48 48)');
    }
    // the pill
    var pill;
    if (!state.started) pill = ['off', 'Sensors off'];
    else if (state.noSensor) pill = ['err', 'No sensor'];
    else if (src === 'gps') pill = ['ok', 'GPS · ' + fmt.kmh(state.gps.speed)];
    else if (state.flat) pill = ['warn', 'Stand the tablet up'];
    else if (src === 'magnet') pill = ['ok', 'Magnet · ' + fmt.deg(h)];
    else pill = ['off', 'Waiting for the sensors'];
    ui.pill.dataset.state = pill[0]; ui.pilltext.textContent = pill[1];
    // readings
    ui.rsrc.textContent = src === 'gps' ? 'GPS' : src === 'magnet' ? 'Magnet' : 'none';
    ui.rraw.textContent = state.flat ? 'flat' : fmt.deg1(state.rawMag);
    ui.rsmooth.textContent = fmt.deg(state.magSmooth.value());
    ui.rlevel.textContent = state.flat ? 'flat' : fmt.num(state.level);
    ui.reps.textContent = String(state.eps);
    ui.roff.textContent = state.offset == null ? 'none' : fmt.signed(state.offset) + ' · set ' + fmt.time(state.offsetAt || 0);
    var g = state.gps;
    ui.rgps.textContent = !g ? 'off' : g.error ? g.error : 'course ' + fmt.deg(g.heading) + ' · ' + fmt.kmh(g.speed) + ' · ' + fmt.m(g.accuracy) + ' · ' + fmt.ago(g.time);
    // the two conditional buttons (items 26, 27)
    var canCal = src === 'gps' && state.magSmooth.value() != null;
    ui.cal.disabled = !canCal; ui.calwhy.hidden = canCal;
    var hasOff = state.offset != null;
    ui.clear.disabled = !hasOff; ui.clearwhy.hidden = hasOff;
  }

  // ---- orientation events ----
  function onOrientation(e) {
    var raw, level;
    if (typeof e.webkitCompassHeading === 'number') { raw = Heading.norm(e.webkitCompassHeading); level = 1; } // iOS: the heading itself
    else if (e.alpha == null && e.beta == null && e.gamma == null) { if (!state.nullSeen) { state.nullSeen = true; log('The browser sent an orientation event without angles: no sensor data yet.'); } return; } // a browser without a sensor sends one empty event
    else {
      if (state.listening === 'deviceorientation' && !e.absolute) return;
      raw = Heading.fromOrientation(e.alpha, e.beta, e.gamma);
      level = levelOf(e.alpha, e.beta, e.gamma);
    }
    state.gotEvent = true; state.noSensor = false;
    if (raw === null) { state.flat = true; state.level = level; schedule(); return; }
    state.flat = false; state.rawMag = raw; state.level = level; state.events++; state.epsCount++;
    var now = performance.now();
    state.magSmooth.push(raw, now);
    if (source() !== 'gps') state.main.push(Heading.norm(raw + (state.offset || 0)), now);
    schedule();
  }

  // ---- GPS ----
  function onFix(pos) {
    var c = pos.coords;
    state.gps = { heading: typeof c.heading === 'number' && !isNaN(c.heading) ? Heading.norm(c.heading) : null,
                  speed: typeof c.speed === 'number' && !isNaN(c.speed) ? c.speed : null,
                  accuracy: c.accuracy, time: pos.timestamp || Date.now(), error: null };
    if (gpsFresh()) state.main.push(state.gps.heading, performance.now()); // a course is true north and needs no offset
    schedule();
  }
  function onGpsError(err) {
    var text = err.code === 1 ? 'Location denied' : err.code === 2 ? 'No position' : err.code === 3 ? 'Position timed out' : 'GPS error ' + err.code;
    state.gps = { error: text, time: Date.now() };
    log(text); schedule();
  }
  function startGps() {
    if (!navigator.geolocation) { log('No geolocation API'); return; }
    if (state.gpsWatch != null) return;
    state.gpsWatch = navigator.geolocation.watchPosition(onFix, onGpsError, { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 });
    state.gps = state.gps || { error: null, heading: null, speed: null, accuracy: null, time: 0 };
    log('GPS on'); ui.gps.textContent = 'GPS: on'; schedule();
  }
  function stopGps() {
    if (state.gpsWatch == null) return;
    navigator.geolocation.clearWatch(state.gpsWatch); state.gpsWatch = null; state.gps = null;
    log('GPS off'); ui.gps.textContent = 'GPS'; schedule();
  }

  // ---- Start ----
  function listen() {
    var name = ('ondeviceorientationabsolute' in window) ? 'deviceorientationabsolute' : 'deviceorientation';
    state.listening = name;
    window.addEventListener(name, onOrientation);
    log('Listening to ' + name + (name === 'deviceorientation' ? ' (absolute events or webkitCompassHeading only)' : ''));
    setTimeout(function () {
      if (!state.gotEvent) { state.noSensor = true; log('No orientation events. Check that the page is https and that Chrome\'s site setting Motion sensors is allowed.'); schedule(); }
    }, 3000);
  }
  function start() {
    if (state.started) return;
    state.started = true; ui.start.textContent = 'Started'; ui.start.disabled = true;
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(function (r) { log('Orientation permission: ' + r); }, function (e) { log('Orientation permission failed: ' + e.message); });
    }
    listen(); // at once: on iOS the events start after the grant, elsewhere they start now
    if (navigator.wakeLock && navigator.wakeLock.request) {
      navigator.wakeLock.request('screen').then(function () { log('Screen wake lock on'); }, function (e) { log('Screen wake lock refused: ' + e.message); });
    } else log('No wake lock API');
    startGps();
    schedule();
  }

  // ---- Calibrate: the mount's angle. The GPS course is true north and the
  // magnet magnetic; in Central Europe they differ by a few degrees, and the
  // offset absorbs that difference along with the angle of the mount. ----
  function calibrate() {
    var mag = state.magSmooth.value();
    if (!gpsFresh() || mag == null) return;
    var course = state.gps.heading;
    var off = Heading.delta(mag, course);
    saveOffset(off);
    log('Offset set to ' + fmt.signed(off) + ' (GPS ' + fmt.deg(course) + ', magnet ' + fmt.deg(mag) + ')');
    schedule();
  }

  ui.start.addEventListener('click', start);
  ui.gps.addEventListener('click', function () { if (state.gpsWatch == null) startGps(); else stopGps(); });
  ui.cal.addEventListener('click', calibrate);
  ui.clear.addEventListener('click', function () { clearOffset(); schedule(); });
  ui.dial.addEventListener('click', function () {
    state.dial = state.dial === 'needle' ? 'card' : 'needle';
    scr.dataset.dial = state.dial; ui.dial.textContent = 'Dial: ' + state.dial;
    log('Dial: ' + (state.dial === 'needle' ? 'the needle turns, the ring stays' : 'the ring turns, the needle points up as the car'));
    schedule();
  });
  ui.size.addEventListener('click', function () {
    state.size = (state.size + 1) % SIZES.length;
    scr.dataset.size = SIZES[state.size]; ui.size.textContent = 'Size: ' + SIZES[state.size];
  });
  ui.theme.addEventListener('click', function () {
    var root = document.documentElement;
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  });
  setInterval(function () { state.eps = state.epsCount; state.epsCount = 0; schedule(); }, 1000);
  draw();
}());
</script>
</body>
</html>
