<!doctype html>
<!--
  POI Tracker: the working prototype's permanent address.
  It opens the newest prototype. The newest file name sits in
  tools/prototype-latest.txt, read fresh on every visit, so this page never
  changes and the tablet keeps one bookmark for good. A new prototype
  version updates prototype-latest.txt only. Decided by the user on
  2026-10-18.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POI Tracker prototype</title>
<style>
  body { margin: 32px; font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         color: #1B2033; background: #EFF3FA; }
</style>
</head>
<body>
<p id="msg">Opening the newest prototype.</p>
<script>
(function () {
  var msg = document.getElementById('msg');
  // the query string and no-store keep the browser and GitHub Pages from
  // answering with an older copy of the file
  fetch('prototype-latest.txt?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (text) {
      var name = text.trim();
      if (!/^poi-tracker-prototype-v[0-9.]+\.html$/.test(name)) throw new Error('unexpected file name');
      location.replace(name + location.hash);
    })
    .catch(function (e) {
      msg.textContent = 'The newest prototype could not be found (' + e.message + '). Check the connection and reload.';
    });
}());
</script>
</body>
</html>
